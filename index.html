<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Snake Spiel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.2em;
            text-shadow: 0 0 15px #00ff88;
            color: #00ff88;
        }

        #info {
            display: flex;
            gap: 40px;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        #score {
            color: #ffd700;
            font-weight: bold;
        }

        #highscore {
            color: #ff6b6b;
            font-weight: bold;
        }

        canvas {
            background: #0f0f1e;
            border: 3px solid #00ff88;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
        }

        #controls {
            margin-top: 20px;
            text-align: center;
        }

        #restartBtn {
            padding: 12px 30px;
            font-size: 1.1em;
            background: #00ff88;
            color: #1a1a2e;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        #restartBtn:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }

        #message {
            margin-top: 15px;
            font-size: 1.3em;
            color: #ff6b6b;
            height: 30px;
        }

        #hint {
            margin-top: 10px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>🐍 Snake</h1>
    <div id="info">
        <div>Punkte: <span id="score">0</span></div>
        <div>Highscore: <span id="highscore">0</span></div>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <div id="message"></div>
    <div id="controls">
        <button id="restartBtn">Neustart</button>
    </div>
    <div id="hint">Steuerung: Pfeiltasten oder WASD</div>

    <script>
        // ========================================
        // SPIEL-KONFIGURATION
        // ========================================
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const messageEl = document.getElementById('message');
        const restartBtn = document.getElementById('restartBtn');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let highscore = parseInt(localStorage.getItem('snakeHighscore') || '0');
        let gameOver = false;
        let gameSpeed = 120;
        let gameLoop = null;

        highscoreEl.textContent = highscore;

        // ========================================
        // SPIEL INITIALISIEREN
        // ========================================
        function initGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameOver = false;
            messageEl.textContent = '';
            scoreEl.textContent = '0';
            placeFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, gameSpeed);
            draw();
        }

        // ========================================
        // ESSEN PLATZIEREN
        // ========================================
        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT)
                };
                validPosition = !snake.some(seg => seg.x === food.x && seg.y === food.y);
            }
        }

        // ========================================
        // UPDATE-LOGIK
        // ========================================
        function update() {
            if (gameOver) return;

            direction = { ...nextDirection };

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Wandkollision
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                endGame();
                return;
            }

            // Selbstkollision
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Essen gefressen?
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highscore) {
                    highscore = score;
                    highscoreEl.textContent = highscore;
                    localStorage.setItem('snakeHighscore', highscore);
                }
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        // ========================================
        // ZEICHNEN
        // ========================================
        function draw() {
            // Hintergrund
            ctx.fillStyle = '#0f0f1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Gitter
            ctx.strokeStyle = '#1e1e3e';
            ctx.lineWidth = 1;
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // Essen
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // Schlange
            snake.forEach((seg, i) => {
                if (i === 0) {
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 15;
                } else {
                    const brightness = Math.max(0.4, 1 - i * 0.03);
                    ctx.fillStyle = `rgba(0, 255, 136, ${brightness})`;
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(
                    seg.x * GRID_SIZE + 1,
                    seg.y * GRID_SIZE + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );
            });
            ctx.shadowBlur = 0;
        }

        // ========================================
        // SPIEL ENDE
        // ========================================
        function endGame() {
            gameOver = true;
            clearInterval(gameLoop);
            messageEl.textContent = `💀 Game Over! Punkte: ${score}`;
        }

        // ========================================
        // STEUERUNG
        // ========================================
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if ((key === 'arrowup' || key === 'w') && direction.y === 0) {
                nextDirection = { x: 0, y: -1 };
            } else if ((key === 'arrowdown' || key === 's') && direction.y === 0) {
                nextDirection = { x: 0, y: 1 };
            } else if ((key === 'arrowleft' || key === 'a') && direction.x === 0) {
                nextDirection = { x: -1, y: 0 };
            } else if ((key === 'arrowright' || key === 'd') && direction.x === 0) {
                nextDirection = { x: 1, y: 0 };
            }
        });

        restartBtn.addEventListener('click', initGame);

        // ========================================
        // SPIEL STARTEN
        // ========================================
        initGame();
    </script>
</body>
</html>
