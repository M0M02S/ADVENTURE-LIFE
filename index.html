<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1128">
<title>TIDAL</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  #game-container {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------- OVERLAYS ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, rgba(10, 30, 60, 0.85), rgba(5, 10, 25, 0.95));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 10;
    padding: 24px;
    transition: opacity 0.4s ease;
  }
  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  h1.title {
    font-size: clamp(56px, 16vw, 130px);
    font-weight: 900;
    letter-spacing: 0.15em;
    background: linear-gradient(180deg, #d0faff 0%, #4dc8ff 40%, #1a6fd8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(77, 200, 255, 0.7));
    margin-bottom: 6px;
    animation: titlePulse 3s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { filter: drop-shadow(0 0 30px rgba(77, 200, 255, 0.7)); }
    50% { filter: drop-shadow(0 0 60px rgba(77, 200, 255, 1)); }
  }

  h2 {
    font-size: clamp(32px, 9vw, 60px);
    font-weight: 900;
    letter-spacing: 0.1em;
    color: #ff6b6b;
    text-shadow: 0 0 30px rgba(255, 107, 107, 0.8);
    margin-bottom: 24px;
    text-align: center;
  }

  .subtitle {
    font-size: clamp(13px, 3.6vw, 17px);
    color: #8ab4d8;
    margin-bottom: 40px;
    letter-spacing: 0.15em;
    text-align: center;
    line-height: 1.6;
  }

  button {
    font-family: inherit;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 700;
    letter-spacing: 0.2em;
    padding: 16px 48px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #4dc8ff 0%, #1a8cd8 100%);
    color: #001a2e;
    cursor: pointer;
    box-shadow: 0 6px 30px rgba(77, 200, 255, 0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    margin: 8px;
    min-width: 180px;
  }
  button:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 50px rgba(77, 200, 255, 0.9), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  button:active {
    transform: scale(0.97);
  }
  button.secondary {
    background: rgba(255, 255, 255, 0.08);
    color: #cfe8ff;
    box-shadow: 0 4px 20px rgba(255, 255, 255, 0.08), inset 0 1px 0 rgba(255,255,255,0.1);
    border: 1px solid rgba(168, 240, 255, 0.25);
  }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
  }
  #hud.hidden { display: none; }
  #score {
    font-size: clamp(32px, 8vw, 46px);
    font-weight: 900;
    color: #d0faff;
    text-shadow: 0 0 24px rgba(77, 200, 255, 0.9), 0 0 8px rgba(77, 200, 255, 0.6);
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
  }
  #pauseBtn {
    pointer-events: auto;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    padding: 0;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: unset;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(168, 240, 255, 0.3);
    color: #fff;
    box-shadow: 0 0 15px rgba(77, 200, 255, 0.3);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  /* ---------- SCORE DISPLAY ---------- */
  .score-display {
    background: linear-gradient(180deg, rgba(77, 200, 255, 0.1), rgba(26, 140, 216, 0.05));
    border: 1px solid rgba(77, 200, 255, 0.35);
    border-radius: 20px;
    padding: 28px 48px;
    margin-bottom: 24px;
    text-align: center;
    box-shadow: 0 0 40px rgba(77, 200, 255, 0.15), inset 0 0 30px rgba(77, 200, 255, 0.05);
  }
  .score-label {
    font-size: 13px;
    color: #8ab4d8;
    letter-spacing: 0.4em;
    margin-bottom: 6px;
  }
  .score-value {
    font-size: clamp(48px, 14vw, 72px);
    font-weight: 900;
    color: #d0faff;
    text-shadow: 0 0 30px rgba(77, 200, 255, 0.9);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .highscore-label {
    margin-top: 20px;
    font-size: 13px;
    color: #ffd700;
    letter-spacing: 0.2em;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
  }
  .highscore-value {
    color: #ffd700;
    font-weight: 800;
  }

  /* ---------- INSTRUCTIONS ---------- */
  .instructions {
    margin-top: 32px;
    font-size: 14px;
    color: #8ab4d8;
    text-align: center;
    line-height: 1.9;
    max-width: 420px;
    padding: 20px;
    border-top: 1px solid rgba(77, 200, 255, 0.15);
  }
  .instructions strong {
    color: #4dc8ff;
    font-weight: 700;
  }
  .instructions .gesture {
    display: inline-block;
    padding: 2px 10px;
    background: rgba(77, 200, 255, 0.15);
    border: 1px solid rgba(77, 200, 255, 0.4);
    border-radius: 6px;
    font-size: 12px;
    color: #a8f0ff;
    margin: 0 2px;
  }

  /* ---------- MENU HIGHSCORE ---------- */
  .menu-highscore {
    margin-top: 24px;
    font-size: 14px;
    color: #ffd700;
    letter-spacing: 0.15em;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
  }

  /* ---------- TUTORIAL HINT ---------- */
  #tutorialHint {
    position: absolute;
    left: 50%;
    bottom: 25%;
    transform: translateX(-50%);
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 700;
    color: #d0faff;
    letter-spacing: 0.15em;
    text-shadow: 0 0 20px rgba(77, 200, 255, 0.9);
    pointer-events: none;
    z-index: 6;
    opacity: 0;
    transition: opacity 0.6s ease;
    text-align: center;
    white-space: nowrap;
  }
  #tutorialHint.visible {
    opacity: 1;
    animation: hintPulse 1.4s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.08); }
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="score">0</div>
    <button id="pauseBtn" aria-label="Pause">⏸</button>
  </div>

  <!-- TUTORIAL HINT -->
  <div id="tutorialHint"></div>

  <!-- MENU -->
  <div id="menu" class="overlay">
    <h1 class="title">TIDAL</h1>
    <p class="subtitle">STEUERE DAS WASSER.<br>NICHT DAS BOOT.</p>
    <button id="playBtn">▶ SPIELEN</button>
    <div class="menu-highscore">
      HIGHSCORE: <span id="menuHighscore">0</span>
    </div>
    <div class="instructions">
      <span class="gesture">GEDRÜCKT HALTEN</span> → Wasser steigt<br>
      <span class="gesture">LOSLASSEN</span> → Wasser sinkt<br><br>
      Manövriere dein Boot durch die Lücken.<br>
      Sammle goldene Bubbles für Bonuspunkte!
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="gameover" class="overlay hidden">
    <h2>GAME OVER</h2>
    <div class="score-display">
      <div class="score-label">PUNKTE</div>
      <div class="score-value" id="finalScore">0</div>
      <div class="highscore-label">HIGHSCORE: <span class="highscore-value" id="finalHighscore">0</span></div>
    </div>
    <button id="retryBtn">NOCHMAL</button>
    <button id="menuBtn" class="secondary">MENÜ</button>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="overlay hidden">
    <h2 style="color:#d0faff; text-shadow: 0 0 30px rgba(77, 200, 255, 0.7);">PAUSE</h2>
    <button id="resumeBtn">WEITER</button>
    <button id="quitBtn" class="secondary">MENÜ</button>
  </div>
</div>

<script>
// =============================================================
//  TIDAL — Version 1.0
//  Steuere das Wasser, nicht das Boot.
// =============================================================

(function () {
  'use strict';

  // ---------- SETUP ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('game-container');

  const menuEl = document.getElementById('menu');
  const gameoverEl = document.getElementById('gameover');
  const pauseEl = document.getElementById('pause');
  const hudEl = document.getElementById('hud');
  const scoreEl = document.getElementById('score');
  const finalScoreEl = document.getElementById('finalScore');
  const finalHighscoreEl = document.getElementById('finalHighscore');
  const menuHighscoreEl = document.getElementById('menuHighscore');
  const tutorialHintEl = document.getElementById('tutorialHint');

  const playBtn = document.getElementById('playBtn');
  const retryBtn = document.getElementById('retryBtn');
  const menuBtn = document.getElementById('menuBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resumeBtn = document.getElementById('resumeBtn');
  const quitBtn = document.getElementById('quitBtn');

  let W = 0, H = 0, DPR = 1;

  function resize() {
    const rect = container.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));
  resize();

  // ---------- STATES ----------
  const STATE = { MENU: 'menu', PLAYING: 'playing', PAUSED: 'paused', GAMEOVER: 'gameover' };
  let state = STATE.MENU;

  // ---------- GAME VARIABLES ----------
  let waterY = 0;
  let waterVel = 0;
  let holding = false;
  let gameTime = 0;
  let scrollSpeed = 260;
  let score = 0;
  let distance = 0;
  let highscore = parseInt(localStorage.getItem('tidal_highscore') || '0', 10);
  let screenShake = 0;
  let flashAlpha = 0;

  const boat = {
    x: 0,
    y: 0,
    angle: 0
  };

  let obstacles = [];
  let bubbles = [];
  let particles = [];
  let floaters = [];

  let obstacleSpawnTimer = 0;
  let bubbleSpawnTimer = 0;
  let tutorialTimer = 0;

  // Physics constants
  const WATER_RISE_ACCEL = -2000;
  const WATER_FALL_ACCEL = 1200;
  const WATER_DAMPING_RATE = 1.5; // per second
  const WATER_MAX_SPEED = 450;
  const BOAT_W = 56;
  const BOAT_H = 38;

  menuHighscoreEl.textContent = highscore;

  // ---------- PARTICLE SYSTEM ----------
  function spawnParticle(x, y, vx, vy, opts) {
    opts = opts || {};
    if (particles.length > 260) return;
    particles.push({
      x: x, y: y, vx: vx, vy: vy,
      life: opts.life || 1,
      maxLife: opts.life || 1,
      size: opts.size || 3,
      color: opts.color || 'rgba(168,240,255,0.8)',
      gravity: opts.gravity || 0
    });
  }

  function spawnSplash(x, y, intensity) {
    const count = Math.floor(intensity * 6);
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.9;
      const speed = 60 + Math.random() * 180 * intensity;
      spawnParticle(
        x + (Math.random() - 0.5) * BOAT_W,
        y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        {
          life: 0.55 + Math.random() * 0.4,
          size: 1.5 + Math.random() * 2.5,
          color: 'rgba(180,230,255,' + (0.5 + Math.random() * 0.4) + ')',
          gravity: 380
        }
      );
    }
  }

  function spawnExplosion(x, y) {
    for (let i = 0; i < 36; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 100 + Math.random() * 380;
      spawnParticle(
        x, y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        {
          life: 0.7 + Math.random() * 0.7,
          size: 3 + Math.random() * 4,
          color: 'rgba(255,' + (120 + Math.random() * 100 | 0) + ',' + (100 + Math.random() * 100 | 0) + ',1)',
          gravity: 220
        }
      );
    }
  }

  // ---------- OBSTACLES ----------
  function Obstacle(x, gapY, gapHeight) {
    this.x = x;
    this.gapY = gapY;
    this.gapHeight = gapHeight;
    this.width = Math.max(64, W * 0.11);
    this.passed = false;
    this.hue = 175 + Math.random() * 45;
    this.glowPulse = Math.random() * Math.PI * 2;
  }

  function spawnObstacle() {
    const gapHeightFactor = Math.max(0.22, 0.38 - distance * 0.0015);
    const gapHeight = H * gapHeightFactor;
    const minY = H * 0.12;
    const maxY = H * 0.85 - gapHeight;
    const gapY = minY + Math.random() * Math.max(0, maxY - minY);
    obstacles.push(new Obstacle(W + 50, gapY, gapHeight));
  }

  // ---------- BUBBLES ----------
  function spawnBubble(x, y) {
    bubbles.push({
      x: x, y: y, r: 11,
      bob: Math.random() * Math.PI * 2,
      pulse: Math.random() * Math.PI * 2
    });
  }

  // ---------- INPUT ----------
  function pointerDown(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (state === STATE.PLAYING) {
      if (!holding) spawnSplash(boat.x, waterY, 0.5);
      holding = true;
    }
  }
  function pointerUp(e) {
    if (e && e.preventDefault) e.preventDefault();
    holding = false;
  }

  canvas.addEventListener('pointerdown', pointerDown, { passive: false });
  window.addEventListener('pointerup', pointerUp, { passive: false });
  window.addEventListener('pointercancel', pointerUp, { passive: false });
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      if (state === STATE.PLAYING) holding = true;
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      holding = false;
      e.preventDefault();
    }
  });

  // ---------- GAME FLOW ----------
  function startGame() {
    state = STATE.PLAYING;
    gameTime = 0;
    score = 0;
    distance = 0;
    waterY = H * 0.5;
    waterVel = 0;
    holding = false;
    scrollSpeed = 260;
    obstacles = [];
    bubbles = [];
    particles = [];
    floaters = [];
    obstacleSpawnTimer = 1.3;
    bubbleSpawnTimer = 1.2;
    screenShake = 0;
    flashAlpha = 0;
    tutorialTimer = 2.6;

    boat.x = Math.max(W * 0.22, 80);
    boat.y = waterY - BOAT_H * 0.4;
    boat.angle = 0;

    scoreEl.textContent = '0';
    tutorialHintEl.textContent = 'GEDRÜCKT HALTEN';
    tutorialHintEl.classList.add('visible');

    menuEl.classList.add('hidden');
    gameoverEl.classList.add('hidden');
    pauseEl.classList.add('hidden');
    hudEl.classList.remove('hidden');

    lastTime = performance.now();
  }

  function goToMenu() {
    state = STATE.MENU;
    menuHighscoreEl.textContent = highscore;
    menuEl.classList.remove('hidden');
    gameoverEl.classList.add('hidden');
    pauseEl.classList.add('hidden');
    hudEl.classList.add('hidden');
    tutorialHintEl.classList.remove('visible');
    resetIdleScene();
  }

  function pauseGame() {
    if (state === STATE.PLAYING) {
      state = STATE.PAUSED;
      pauseEl.classList.remove('hidden');
      holding = false;
    }
  }

  function resumeGame() {
    if (state === STATE.PAUSED) {
      state = STATE.PLAYING;
      pauseEl.classList.add('hidden');
      lastTime = performance.now();
    }
  }

  function gameOver() {
    state = STATE.GAMEOVER;
    screenShake = 22;
    flashAlpha = 0.55;
    spawnExplosion(boat.x, boat.y);
    holding = false;
    tutorialHintEl.classList.remove('visible');

    if (score > highscore) {
      highscore = score;
      try { localStorage.setItem('tidal_highscore', String(highscore)); } catch (e) {}
    }
    finalScoreEl.textContent = score;
    finalHighscoreEl.textContent = highscore;
    hudEl.classList.add('hidden');

    setTimeout(function () {
      if (state === STATE.GAMEOVER) gameoverEl.classList.remove('hidden');
    }, 750);
  }

  function resetIdleScene() {
    waterY = H * 0.62;
    waterVel = 0;
    boat.x = Math.max(W * 0.22, 80);
    boat.y = waterY - BOAT_H * 0.4;
    boat.angle = 0;
    particles = [];
    obstacles = [];
    bubbles = [];
    floaters = [];
  }

  // ---------- UPDATE ----------
  function update(dt) {
    if (dt > 0.05) dt = 0.05;

    if (state === STATE.PLAYING) {
      gameTime += dt;

      // Tutorial hint fade
      if (tutorialTimer > 0) {
        tutorialTimer -= dt;
        if (tutorialTimer <= 0) tutorialHintEl.classList.remove('visible');
      }

      // Difficulty scaling
      scrollSpeed = 260 + Math.min(distance * 0.55, 280);

      // Water physics
      const accel = holding ? WATER_RISE_ACCEL : WATER_FALL_ACCEL;
      waterVel += accel * dt;
      const damping = Math.exp(-WATER_DAMPING_RATE * dt);
      waterVel *= damping;
      if (waterVel > WATER_MAX_SPEED) waterVel = WATER_MAX_SPEED;
      if (waterVel < -WATER_MAX_SPEED) waterVel = -WATER_MAX_SPEED;
      waterY += waterVel * dt;

      const minY = H * 0.08;
      const maxY = H * 0.92;
      if (waterY < minY) { waterY = minY; waterVel = Math.max(0, waterVel); }
      if (waterY > maxY) { waterY = maxY; waterVel = Math.min(0, waterVel); }

      // Splash particles when moving fast
      if (Math.abs(waterVel) > 180 && Math.random() < 0.55) {
        spawnSplash(boat.x, waterY, Math.min(1, Math.abs(waterVel) / WATER_MAX_SPEED));
      }

      // Boat follows water surface
      const bob = Math.sin(gameTime * 3.2) * 2.5;
      const targetY = waterY - BOAT_H * 0.4 + bob;
      boat.y += (targetY - boat.y) * Math.min(1, 16 * dt);

      // Boat tilt based on water velocity
      let targetAngle = waterVel * 0.0009;
      if (targetAngle > 0.35) targetAngle = 0.35;
      if (targetAngle < -0.35) targetAngle = -0.35;
      boat.angle += (targetAngle - boat.angle) * Math.min(1, 10 * dt);

      distance += scrollSpeed * dt * 0.01;

      // Spawn obstacles
      obstacleSpawnTimer -= dt;
      if (obstacleSpawnTimer <= 0) {
        spawnObstacle();
        const baseInterval = Math.max(1.05, 2.0 - distance * 0.004);
        obstacleSpawnTimer = baseInterval + Math.random() * 0.35;
      }

      // Spawn bubbles
      bubbleSpawnTimer -= dt;
      if (bubbleSpawnTimer <= 0) {
        spawnBubble(W + 40, H * 0.12 + Math.random() * H * 0.76);
        bubbleSpawnTimer = 1.6 + Math.random() * 2.2;
      }

      // Update obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= scrollSpeed * dt;
        obs.glowPulse += dt * 3;

        if (!obs.passed && obs.x + obs.width < boat.x - BOAT_W * 0.5) {
          obs.passed = true;
          score += 1;
          scoreEl.textContent = score;
        }
        if (obs.x + obs.width < -60) obstacles.splice(i, 1);
      }

      // Update bubbles
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.x -= scrollSpeed * dt;
        b.bob += dt * 2;
        b.pulse += dt * 4;

        const dx = b.x - boat.x;
        const dy = (b.y + Math.sin(b.bob) * 5) - boat.y;
        const hitR = BOAT_W * 0.5 + b.r;
        if (dx * dx + dy * dy < hitR * hitR) {
          score += 5;
          scoreEl.textContent = score;
          for (let k = 0; k < 12; k++) {
            const a = Math.random() * Math.PI * 2;
            spawnParticle(b.x, b.y, Math.cos(a) * 200, Math.sin(a) * 200, {
              life: 0.5, size: 3, color: 'rgba(255,215,0,0.9)', gravity: 0
            });
          }
          floaters.push({ x: b.x, y: b.y, text: '+5', life: 1, maxLife: 1, vy: -80 });
          bubbles.splice(i, 1);
          continue;
        }
        if (b.x < -60) bubbles.splice(i, 1);
      }

      // Collision check
      const bt = boat.y - BOAT_H * 0.4;
      const bb = boat.y + BOAT_H * 0.4;
      const bl = boat.x - BOAT_W * 0.4;
      const br = boat.x + BOAT_W * 0.4;

      for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        if (br > obs.x + 4 && bl < obs.x + obs.width - 4) {
          if (bt < obs.gapY || bb > obs.gapY + obs.gapHeight) {
            gameOver();
            break;
          }
        }
      }
    }

    // Particles (always)
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    // Floaters
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt;
      f.y += f.vy * dt;
      f.vy *= 0.95;
      if (f.life <= 0) floaters.splice(i, 1);
    }

    if (screenShake > 0) screenShake *= Math.exp(-8 * dt);
    if (screenShake < 0.5) screenShake = 0;
    if (flashAlpha > 0) flashAlpha -= dt * 1.5;
    if (flashAlpha < 0) flashAlpha = 0;

    // Idle animation (menu / gameover)
    if (state === STATE.MENU || state === STATE.GAMEOVER) {
      gameTime += dt;
      waterY = H * 0.62;
      boat.y = waterY - BOAT_H * 0.4 + Math.sin(gameTime * 1.5) * 4;
      boat.angle = Math.sin(gameTime * 1.2) * 0.05;
    }
  }

  const ambientBubbles = [];
  for (let i = 0; i < 32; i++) {
    ambientBubbles.push({
      x: Math.random(),
      y: Math.random(),
      r: 1 + Math.random() * 3.5,
      speed: 0.006 + Math.random() * 0.02,
      drift: Math.random() * Math.PI * 2,
      depth: Math.random()
    });
  }

  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a1128');
    grad.addColorStop(0.4, '#0d1f3f');
    grad.addColorStop(0.7, '#122f5a');
    grad.addColorStop(1, '#081428');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (let i = 0; i < 50; i++) {
      const sx = (i * 137.5 + gameTime * 4) % W;
      const sy = (i * 73.3) % (H * 0.72);
      const alpha = 0.15 + Math.abs(Math.sin(gameTime * 1.5 + i)) * 0.25;
      ctx.fillStyle = 'rgba(200,230,255,' + alpha + ')';
      ctx.beginPath();
      ctx.arc(sx, sy, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }

    // Ambient bubbles
    for (let i = 0; i < ambientBubbles.length; i++) {
      const b = ambientBubbles[i];
      b.y -= b.speed * 0.016;
      b.drift += 0.015;
      if (b.y < -0.1) { b.y = 1.1; b.x = Math.random(); }
      const px = (b.x + Math.sin(b.drift) * 0.02) * W;
      const py = b.y * H;
      const alpha = 0.08 + b.depth * 0.2;
      ctx.fillStyle = 'rgba(168,240,255,' + alpha + ')';
      ctx.beginPath();
      ctx.arc(px, py, b.r * (0.5 + b.depth), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawWater() {
    const wy = waterY;
    const waveSpeed = gameTime * 2;
    const waveFreq = 0.008;

    // Water body
    const grad = ctx.createLinearGradient(0, wy, 0, H);
    grad.addColorStop(0, 'rgba(50,160,230,0.80)');
    grad.addColorStop(0.25, 'rgba(25,105,195,0.88)');
    grad.addColorStop(1, 'rgba(5,25,70,0.96)');
    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, wy);
    for (let x = 0; x <= W; x += 4) {
      let y = wy;
      y += Math.sin(x * waveFreq + waveSpeed) * 4;
      y += Math.sin(x * waveFreq * 2.3 + waveSpeed * 1.4) * 2;
      y += Math.sin(x * waveFreq * 0.7 - waveSpeed * 0.7) * 2.8;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // Surface highlight
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const surfGrad = ctx.createLinearGradient(0, wy - 14, 0, wy + 8);
    surfGrad.addColorStop(0, 'rgba(168,240,255,0)');
    surfGrad.addColorStop(0.45, 'rgba(168,240,255,0.55)');
    surfGrad.addColorStop(1, 'rgba(100,200,255,0)');
    ctx.fillStyle = surfGrad;
    ctx.beginPath();
    ctx.moveTo(0, wy - 14);
    for (let x = 0; x <= W; x += 4) {
      let y = wy;
      y += Math.sin(x * waveFreq + waveSpeed) * 4;
      y += Math.sin(x * waveFreq * 2.3 + waveSpeed * 1.4) * 2;
      y += Math.sin(x * waveFreq * 0.7 - waveSpeed * 0.7) * 2.8;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, wy + 8);
    ctx.lineTo(0, wy + 8);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

      ctx.stroke();
    }
  }
