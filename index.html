<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1128">
<title>TIDAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(10,30,60,.9),rgba(5,10,25,.97));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:10;padding:24px;overflow-y:auto}
.ov.hide{opacity:0;pointer-events:none}
.hide{display:none!important}
button{font-family:inherit;font-size:clamp(15px,4vw,18px);font-weight:700;letter-spacing:.15em;padding:14px 36px;border:none;border-radius:12px;background:linear-gradient(135deg,#4dc8ff,#1a8cd8);color:#001a2e;cursor:pointer;box-shadow:0 6px 25px rgba(77,200,255,.5);margin:6px;min-width:160px}
button:active{transform:scale(.97)}
button.sec{background:rgba(255,255,255,.1);color:#cfe8ff;box-shadow:none;border:1px solid rgba(168,240,255,.25)}
h1{font-size:clamp(56px,16vw,120px);font-weight:900;letter-spacing:.12em;background:linear-gradient(180deg,#d0faff,#4dc8ff 40%,#1a6fd8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(77,200,255,.7));margin-bottom:8px}
h2{font-size:clamp(28px,8vw,50px);font-weight:900;letter-spacing:.08em;color:#ff6b6b;text-shadow:0 0 30px rgba(255,107,107,.8);margin-bottom:20px;text-align:center}
.sub{font-size:13px;color:#8ab4d8;margin-bottom:24px;letter-spacing:.15em;text-align:center;line-height:1.6}
.info{margin-top:14px;font-size:16px;color:#ffd700;font-weight:700}
#hud{position:absolute;inset:0;pointer-events:none;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:20px;padding-top:max(20px,env(safe-area-inset-top))}
#score{font-size:clamp(32px,8vw,44px);font-weight:900;color:#d0faff;text-shadow:0 0 24px rgba(77,200,255,.9);font-variant-numeric:tabular-nums}
#pause{pointer-events:auto;width:50px;height:50px;border-radius:50%;padding:0;font-size:20px;min-width:unset;background:rgba(255,255,255,.15);border:1px solid rgba(168,240,255,.3);margin:0}
#admin-btn{position:absolute;bottom:16px;left:16px;width:36px;height:36px;border-radius:50%;padding:0;font-size:14px;min-width:unset;opacity:.2;background:rgba(255,255,255,.05);box-shadow:none;margin:0}
#shop-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%;max-width:560px;max-height:50vh;overflow-y:auto;padding:6px;margin-bottom:12px}
.item{background:rgba(255,255,255,.05);border:1.5px solid rgba(168,240,255,.2);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.item.on{border-color:#4dc8ff;box-shadow:0 0 18px rgba(77,200,255,.5)}
.prev{width:100%;height:50px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(0,0,0,.3)}
.name{font-size:12px;font-weight:700;color:#d0faff;text-align:center}
.desc{font-size:10px;color:#8ab4d8;text-align:center}
.item button{width:100%;padding:6px;font-size:11px;letter-spacing:.05em;min-width:unset;margin:0;border-radius:6px}
.buy{background:linear-gradient(135deg,#ffd700,#cc8800);color:#2a1800}
.own{background:rgba(100,200,255,.2);color:#d0faff;border:1px solid rgba(168,240,255,.4);box-shadow:none}
.sel{background:rgba(80,200,100,.3);color:#a0ffa0;border:1px solid rgba(100,255,100,.5);box-shadow:none}
#code{width:100%;max-width:280px;padding:14px;border-radius:10px;background:rgba(0,0,0,.5);border:2px solid rgba(255,128,255,.4);color:#fff;font-size:18px;text-align:center;letter-spacing:.3em;margin:16px 0;outline:none;text-transform:uppercase;font-family:inherit}
#code:focus{border-color:#ff80ff;box-shadow:0 0 20px rgba(255,128,255,.5)}
#err{color:#ff6b6b;font-size:13px;min-height:18px;margin-bottom:6px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:440px;width:100%;margin:10px 0}
.grid button{padding:12px;font-size:12px;letter-spacing:.02em;min-width:unset;margin:0;background:linear-gradient(135deg,#ff80ff,#8000ff);box-shadow:0 4px 15px rgba(200,0,255,.4)}
.grid button.danger{background:linear-gradient(135deg,#ff5757,#cc0000)}
.grid button.ok{background:linear-gradient(135deg,#4dff80,#00aa44);color:#002a10}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud" class="hide">
    <div id="score">0</div>
    <button id="pause">⏸</button>
  </div>
  <div id="menu" class="ov">
    <h1>TIDAL</h1>
    <div class="sub">STEUERE DAS WASSER.<br>NICHT DAS BOOT.</div>
    <button id="play">▶ SPIELEN</button>
    <button id="shop-btn" class="sec">🛒 SHOP</button>
    <div class="info">💰 <span id="coins">0</span></div>
    <div class="info">🏆 <span id="hs">0</span></div>
    <div class="sub" style="margin-top:20px;font-size:12px">GEDRÜCKT HALTEN → Wasser steigt<br>LOSLASSEN → Wasser sinkt</div>
    <button id="admin-btn">⚙</button>
  </div>
  <div id="shop" class="ov hide">
    <h2 style="color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,.7)">SHOP</h2>
    <div class="info">💰 <span id="shop-coins">0</span></div>
    <div style="display:flex;gap:8px;margin:12px 0">
      <button id="tab-boats" class="sec">BOOTE</button>
      <button id="tab-walls" class="sec">WÄNDE</button>
    </div>
    <div id="shop-list"></div>
    <button id="shop-back" class="sec">ZURÜCK</button>
  </div>
  <div id="gameover" class="ov hide">
    <h2>GAME OVER</h2>
    <div class="info" style="font-size:24px">PUNKTE: <span id="final">0</span></div>
    <div class="info">+💰 <span id="earned">0</span></div>
    <button id="retry">NOCHMAL</button>
    <button id="to-menu" class="sec">MENÜ</button>
  </div>
  <div id="pause-ov" class="ov hide">
    <h2 style="color:#d0faff;text-shadow:0 0 30px rgba(77,200,255,.7)">PAUSE</h2>
    <button id="resume">WEITER</button>
    <button id="quit" class="sec">MENÜ</button>
  </div>
  <div id="admin-login" class="ov hide" style="background:radial-gradient(circle at center,rgba(80,0,80,.94),rgba(20,0,30,.98))">
    <h2 style="color:#ff80ff;text-shadow:0 0 30px rgba(255,128,255,.8)">🔐 ADMIN</h2>
    <input type="password" id="code" placeholder="••••••••" maxlength="32" autocomplete="off">
    <div id="err"></div>
    <button id="login">EINLOGGEN</button>
    <button id="cancel" class="sec">ABBRECHEN</button>
  </div>
  <div id="admin-panel" class="ov hide" style="background:radial-gradient(circle at center,rgba(80,0,80,.94),rgba(20,0,30,.98))">
    <h2 style="color:#ff80ff;text-shadow:0 0 30px rgba(255,128,255,.8)">👑 ADMIN</h2>
    <div class="info">💰 <span id="admin-coins">0</span></div>
    <div class="grid">
      <button class="ok" data-ad="c1000">+1000💰</button>
      <button class="ok" data-ad="c9999">+9999💰</button>
      <button class="ok" data-ad="skins">Alle Skins</button>
      <button class="ok" data-ad="hs9999">HS 9999</button>
      <button data-ad="c0">Münzen weg</button>
      <button class="danger" data-ad="reset">Reset</button>
    </div>
    <button id="admin-close" class="sec">ZURÜCK</button>
  </div>
</div>
<script>
(function(){
'use strict';
var $ = function(id){return document.getElementById(id)};
var cv = $('game'), cx = cv.getContext('2d');
var W = 0, H = 0;

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.floor(W * dpr);
  cv.height = Math.floor(H * dpr);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
resize();

// ---------- STATE ----------
var S = { MENU:0, PLAY:1, PAUSE:2, OVER:3 };
var state = S.MENU;

// ---------- GAME ----------
var waterY = 0, waterVel = 0, holding = false;
var boat = { x: 0, y: 0, angle: 0 };
var obstacles = [], bubbles = [], particles = [], floaters = [];
var score = 0, gameTime = 0, scrollSpeed = 260, dist = 0;
var spawnTimer = 0, bubbleTimer = 0;
var shake = 0, flash = 0;
var BOAT_W = 56, BOAT_H = 38;
var BUB_R = 17, SBUB_R = 26;
var BUB_MARGIN = 40;

// ---------- SAVE ----------
var coins = parseInt(localStorage.getItem('tidal_coins') || '0', 10);
var highscore = parseInt(localStorage.getItem('tidal_hs') || '0', 10);
var owned = { boats:['classic'], walls:['crystal'] };
try {
  var o = JSON.parse(localStorage.getItem('tidal_owned') || 'null');
  if(o && o.boats && o.walls){
    owned = o;
    if(owned.boats.indexOf('classic') < 0) owned.boats.push('classic');
    if(owned.walls.indexOf('crystal') < 0) owned.walls.push('crystal');
  }
} catch(e){}
var selBoat = localStorage.getItem('tidal_boat') || 'classic';
var selWall = localStorage.getItem('tidal_wall') || 'crystal';
if(owned.boats.indexOf(selBoat) < 0) selBoat = 'classic';
if(owned.walls.indexOf(selWall) < 0) selWall = 'crystal';
var curTab = 'boats';

function save(){
  try {
    localStorage.setItem('tidal_coins', coins);
    localStorage.setItem('tidal_hs', highscore);
    localStorage.setItem('tidal_owned', JSON.stringify(owned));
    localStorage.setItem('tidal_boat', selBoat);
    localStorage.setItem('tidal_wall', selWall);
  } catch(e){}
}

function updCoins(){
  $('coins').textContent = coins;
  $('shop-coins').textContent = coins;
  $('admin-coins').textContent = coins;
}

var items = {
  boats: [
    {id:'classic', name:'Holzschiff', desc:'Klassisch', price:0, emoji:'🛶'},
    {id:'pirate', name:'Piratenschiff', desc:'Gefährlich', price:100, emoji:'🏴‍☠️'},
    {id:'crystal', name:'Kristallboot', desc:'Leuchtet', price:250, emoji:'💎'},
    {id:'golden', name:'Goldboot', desc:'Luxus', price:500, emoji:'👑'}
  ],
  walls: [
    {id:'crystal', name:'Türkis', desc:'Standard', price:0, emoji:'💠'},
    {id:'neon', name:'Neon Pink', desc:'Knallig', price:75, emoji:'💜'},
    {id:'lava', name:'Lava', desc:'Heiß', price:150, emoji:'🔥'},
    {id:'ice', name:'Eisblau', desc:'Kalt', price:300, emoji:'❄️'}
  ]
};

var palettes = {
  classic:{top:'#e8b878',mid:'#c8822c',dark:'#8f4a18',bottom:'#4a2208',stripe:'rgba(50,120,200,.7)',sail:'#e4f4ff',flag:'#ff5757',glow:'rgba(168,240,255,.32)'},
  pirate:{top:'#5a5a5a',mid:'#2a2a2a',dark:'#151515',bottom:'#000',stripe:'rgba(180,30,30,.75)',sail:'#3a3a3a',flag:'#000',glow:'rgba(255,80,80,.28)'},
  crystal:{top:'#c0f8ff',mid:'#60d0ff',dark:'#0080e0',bottom:'#004090',stripe:'rgba(200,255,255,.8)',sail:'#c0f8ff',flag:'#a0f0ff',glow:'rgba(100,220,255,.45)'},
  golden:{top:'#fff5a0',mid:'#ffd700',dark:'#c08020',bottom:'#805000',stripe:'rgba(255,240,150,.8)',sail:'#fff5a0',flag:'#ffaa00',glow:'rgba(255,215,0,.45)'}
};

function wallHue(){
  if(selWall === 'neon') return 300 + Math.random() * 30;
  if(selWall === 'lava') return 5 + Math.random() * 25;
  if(selWall === 'ice') return 200 + Math.random() * 20;
  return 175 + Math.random() * 45;
}

// ---------- SPAWN ----------
function spawnObstacle(){
  var hf = Math.max(0.22, 0.38 - dist * 0.0015);
  var gh = H * hf;
  var minY = H * 0.12;
  var maxY = H * 0.85 - gh;
  var gy = minY + Math.random() * Math.max(0, maxY - minY);
  obstacles.push({
    x: W + 50, gapY: gy, gapHeight: gh,
    width: Math.max(64, W * 0.11),
    passed: false, hue: wallHue(),
    pulse: Math.random() * Math.PI * 2
  });
}

function spawnBubble(){
  var target = null, cd = Infinity;
  for(var i = 0; i < obstacles.length; i++){
    var o = obstacles[i];
    if(o.x + o.width < W + 26 - 60) continue;
    if(o.x > W + 26 + 200) continue;
    var d = Math.abs(o.x - (W + 26));
    if(d < cd){ cd = d; target = o; }
  }
  if(!target) return false;
  var isSuper = Math.random() < 0.06;
  var r = isSuper ? SBUB_R : BUB_R;
  var st = target.gapY + r + BUB_MARGIN;
  var sb = target.gapY + target.gapHeight - r - BUB_MARGIN;
  if(st >= sb) return false;
  var y = (st + sb) / 2;
  bubbles.push({
    x: W + 26, y: y, r: r, isSuper: isSuper,
    bob: Math.random() * 6.28, pulse: Math.random() * 6.28,
    rot: Math.random() * 6.28
  });
  return true;
}

function splash(x, y, inten, rising){
  var n = Math.max(1, Math.floor(inten * 8));
  for(var i = 0; i < n; i++){
    var ang, sp, vx, vy;
    if(rising){
      ang = -Math.PI/2 + (Math.random()-.5) * Math.PI * .9;
      sp = 90 + Math.random() * 200 * inten;
      vx = Math.cos(ang) * sp;
      vy = Math.sin(ang) * sp;
    } else {
      var side = Math.random() < .5 ? -1 : 1;
      ang = (side > 0 ? 0 : Math.PI) + (Math.random()-.5) * Math.PI * .5;
      sp = 70 + Math.random() * 160 * inten;
      vx = Math.cos(ang) * sp;
      vy = Math.sin(ang) * sp - 30;
    }
    particles.push({
      x: x + (Math.random()-.5) * 50,
      y: y, vx: vx, vy: vy,
      life: .5 + Math.random() * .4, max: .5 + Math.random() * .4,
      size: 1.5 + Math.random() * 2.5,
      color: 'rgba(200,240,255,' + (.6 + Math.random() * .4) + ')',
      g: 380
    });
  }
}

function explode(x, y){
  for(var i = 0; i < 30; i++){
    var a = Math.random() * Math.PI * 2;
    var s = 100 + Math.random() * 350;
    particles.push({
      x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: .7 + Math.random() * .6, max: 1.3,
      size: 3 + Math.random() * 4,
      color: 'rgba(255,' + ((120 + Math.random() * 100)|0) + ',' + ((100 + Math.random() * 100)|0) + ',1)',
      g: 220
    });
  }
}

// ---------- FLOW ----------
function startGame(){
  state = S.PLAY;
  score = 0; dist = 0; gameTime = 0;
  waterY = H * 0.5; waterVel = 0; holding = false;
  obstacles = []; bubbles = []; particles = []; floaters = [];
  spawnTimer = 1.3; bubbleTimer = 1.2;
  shake = 0; flash = 0;
  boat.x = Math.max(W * 0.22, 80);
  boat.y = waterY - BOAT_H * .4;
  boat.angle = 0;
  $('score').textContent = '0';
  $('menu').classList.add('hide');
  $('shop').classList.add('hide');
  $('gameover').classList.add('hide');
  $('pause-ov').classList.add('hide');
  $('hud').classList.remove('hide');
  lastTime = performance.now();
}

function toMenu(){
  state = S.MENU;
  $('hs').textContent = highscore;
  updCoins();
  $('menu').classList.remove('hide');
  $('shop').classList.add('hide');
  $('gameover').classList.add('hide');
  $('pause-ov').classList.add('hide');
  $('hud').classList.add('hide');
  waterY = H * .62;
  waterVel = 0;
  boat.x = Math.max(W * .22, 80);
  boat.y = waterY - BOAT_H * .4;
  boat.angle = 0;
  obstacles = []; bubbles = []; particles = []; floaters = [];
}

function pauseGame(){
  if(state === S.PLAY){
    state = S.PAUSE;
    $('pause-ov').classList.remove('hide');
    holding = false;
  }
}

function resumeGame(){
  if(state === S.PAUSE){
    state = S.PLAY;
    $('pause-ov').classList.add('hide');
    lastTime = performance.now();
  }
}

function gameOver(){
  state = S.OVER;
  shake = 22; flash = .55;
  explode(boat.x, boat.y);
  holding = false;
  if(score > highscore){ highscore = score; }
  var earned = Math.floor(score / 2);
  coins += earned;
  save();
  $('earned').textContent = earned;
  $('final').textContent = score;
  updCoins();
  $('hud').classList.add('hide');
  setTimeout(function(){
    if(state === S.OVER) $('gameover').classList.remove('hide');
  }, 700);
}

// ---------- SHOP ----------
function openShop(){
  $('menu').classList.add('hide');
  $('shop').classList.remove('hide');
  curTab = 'boats';
  renderShop();
}
function closeShop(){
  $('shop').classList.add('hide');
  $('menu').classList.remove('hide');
  updCoins();
}
function renderShop(){
  $('shop-coins').textContent = coins;
  $('tab-boats').classList.toggle('sec', curTab !== 'boats');
  $('tab-walls').classList.toggle('sec', curTab !== 'walls');
  var list = items[curTab];
  var html = '';
  for(var i = 0; i < list.length; i++){
    var it = list[i];
    var isOwn = owned[curTab].indexOf(it.id) >= 0;
    var isSel = (curTab === 'boats' ? selBoat : selWall) === it.id;
    var lbl, cls, act;
    if(isSel){ lbl = '✓'; cls = 'sel'; act = 'none'; }
    else if(isOwn){ lbl = 'AUSWÄHLEN'; cls = 'own'; act = 'sel'; }
    else { lbl = it.price + ' 💰'; cls = 'buy'; act = 'buy'; }
    var dis = (!isOwn && coins < it.price) ? ' disabled' : '';
    html += '<div class="item' + (isSel ? ' on' : '') + '">' +
      '<div class="prev">' + it.emoji + '</div>' +
      '<div class="name">' + it.name + '</div>' +
      '<div class="desc">' + it.desc + '</div>' +
      '<button class="' + cls + '" data-act="' + act + '" data-id="' + it.id + '" data-tab="' + curTab + '"' + dis + '>' + lbl + '</button>' +
      '</div>';
  }
  $('shop-list').innerHTML = html;
  var btns = $('shop-list').querySelectorAll('button');
  for(var j = 0; j < btns.length; j++) btns[j].addEventListener('click', shopAction);
}
function shopAction(){
  var act = this.dataset.act, id = this.dataset.id, tab = this.dataset.tab;
  if(act === 'none') return;
  if(act === 'sel'){
    if(tab === 'boats') selBoat = id; else selWall = id;
    save(); renderShop();
  } else if(act === 'buy'){
    var it = null;
    for(var i = 0; i < items[tab].length; i++){ if(items[tab][i].id === id){ it = items[tab][i]; break; } }
    if(!it || coins < it.price) return;
    coins -= it.price;
    owned[tab].push(id);
    if(tab === 'boats') selBoat = id; else selWall = id;
    save(); updCoins(); renderShop();
  }
}

// ---------- UPDATE ----------
function update(dt){
  if(dt > .05) dt = .05;
  
  if(state === S.PLAY){
    gameTime += dt;
    scrollSpeed = 260 + Math.min(dist * .55, 280);
    
    var tv = holding ? -420 : 320;
    var resp = holding ? 10 : 6;
    waterVel += (tv - waterVel) * (1 - Math.exp(-resp * dt));
    if(waterVel > 520) waterVel = 520;
    if(waterVel < -520) waterVel = -520;
    waterY += waterVel * dt;
    
    var minY = H * .08, maxY = H * .92;
    if(waterY < minY){ waterY = minY; if(waterVel < 0) waterVel *= -.35; }
    if(waterY > maxY){ waterY = maxY; if(waterVel > 0) waterVel *= -.35; }
    
    if(Math.abs(waterVel) > 140 && Math.random() < .65){
      splash(boat.x, waterY, Math.min(1, Math.abs(waterVel) / 520), waterVel < 0);
    }
    
    var bob = Math.sin(gameTime * 3.2) * 2.2 + Math.sin(gameTime * 5.7) * .9;
    boat.y = waterY - BOAT_H * .4 + bob;
    var ta = waterVel * .0011 + Math.sin(gameTime * 2.1) * .035;
    if(ta > .42) ta = .42;
    if(ta < -.42) ta = -.42;
    boat.angle += (ta - boat.angle) * (1 - Math.exp(-11 * dt));
    
    dist += scrollSpeed * dt * .01;
    
    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnObstacle();
      spawnTimer = Math.max(1.05, 2 - dist * .004) + Math.random() * .35;
    }
    bubbleTimer -= dt;
    if(bubbleTimer <= 0){
      bubbleTimer = spawnBubble() ? (1.6 + Math.random() * 2.2) : .15;
    }
    
    for(var i = obstacles.length - 1; i >= 0; i--){
      var o = obstacles[i];
      o.x -= scrollSpeed * dt;
      o.pulse += dt * 3;
      if(!o.passed && o.x + o.width < boat.x - BOAT_W * .5){
        o.passed = true; score += 1; $('score').textContent = score;
      }
      if(o.x + o.width < -60) obstacles.splice(i, 1);
    }
    
    for(var j = bubbles.length - 1; j >= 0; j--){
      var b = bubbles[j];
      b.x -= scrollSpeed * dt;
      b.bob += dt * 2; b.pulse += dt * 4;
      b.rot += dt * (b.isSuper ? 2.2 : 0);
      var dx = b.x - boat.x;
      var dy = (b.y + Math.sin(b.bob) * 5) - boat.y;
      var hr = BOAT_W * .5 + b.r;
      if(dx * dx + dy * dy < hr * hr){
        var pts = b.isSuper ? 25 : 5;
        score += pts; $('score').textContent = score;
        for(var k = 0; k < 12; k++){
          var a = Math.random() * Math.PI * 2;
          var s = b.isSuper ? 260 : 200;
          particles.push({
            x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: .6, max: .6, size: 3.5,
            color: b.isSuper ? 'rgba(255,150,255,.9)' : 'rgba(255,215,0,.9)',
            g: 0
          });
        }
        floaters.push({
          x: b.x, y: b.y, text: '+' + pts,
          life: 1, max: 1, vy: -80,
          color: b.isSuper ? '#ff80ff' : '#ffd700',
          size: b.isSuper ? 28 : 22
        });
        bubbles.splice(j, 1);
        continue;
      }
      if(b.x < -60) bubbles.splice(j, 1);
    }
    
    var bt = boat.y - BOAT_H * .4;
    var bb = boat.y + BOAT_H * .4;
    var bl = boat.x - BOAT_W * .4;
    var br = boat.x + BOAT_W * .4;
    for(var m = 0; m < obstacles.length; m++){
      var o2 = obstacles[m];
      if(br > o2.x + 4 && bl < o2.x + o2.width - 4){
        if(bt < o2.gapY || bb > o2.gapY + o2.gapHeight){ gameOver(); break; }
      }
    }
  }
  
  for(var p = particles.length - 1; p >= 0; p--){
    var pa = particles[p];
    pa.life -= dt;
    if(pa.life <= 0){ particles.splice(p, 1); continue; }
    pa.vy += pa.g * dt;
    pa.x += pa.vx * dt;
    pa.y += pa.vy * dt;
  }
  for(var f = floaters.length - 1; f >= 0; f--){
    var fl = floaters[f];
    fl.life -= dt;
    fl.y += fl.vy * dt;
    fl.vy *= .95;
    if(fl.life <= 0) floaters.splice(f, 1);
  }
  
  if(shake > 0) shake *= Math.exp(-8 * dt);
  if(shake < .5) shake = 0;
  if(flash > 0) flash -= dt * 1.5;
  if(flash < 0) flash = 0;
  
  if(state === S.MENU || state === S.OVER){
    gameTime += dt;
    waterY = H * .62;
    boat.y = waterY - BOAT_H * .4 + Math.sin(gameTime * 1.5) * 3;
    boat.angle = Math.sin(gameTime * 1.2) * .05;
  }
}

// ---------- RENDER ----------
function render(){
  cx.save();
  if(shake > 0){
    cx.translate((Math.random()-.5) * shake, (Math.random()-.5) * shake);
  }
  
  // Bg
  var bg = cx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a1128');
  bg.addColorStop(.4, '#0d1f3f');
  bg.addColorStop(.7, '#122f5a');
  bg.addColorStop(1, '#081428');
  cx.fillStyle = bg;
  cx.fillRect(0, 0, W, H);
  
  // Stars
  for(var i = 0; i < 40; i++){
    var sx = (i * 137.5 + gameTime * 4) % W;
    var sy = (i * 73.3) % (H * .7);
    var al = .15 + Math.abs(Math.sin(gameTime * 1.5 + i)) * .25;
    cx.fillStyle = 'rgba(200,230,255,' + al + ')';
    cx.beginPath();
    cx.arc(sx, sy, 1.2, 0, 6.28);
    cx.fill();
  }
  
  // Water
  drawWater();
  
  // Obstacles
  for(var i = 0; i < obstacles.length; i++) drawObs(obstacles[i]);
  
  // Bubbles
  for(var i = 0; i < bubbles.length; i++) drawBub(bubbles[i]);
  
  // Boat
  if(state !== S.OVER) drawBoat();
  
  // Particles
  for(var i = 0; i < particles.length; i++){
    var p = particles[i];
    cx.globalAlpha = Math.max(0, p.life / p.max);
    cx.fillStyle = p.color;
    cx.beginPath();
    cx.arc(p.x, p.y, p.size, 0, 6.28);
    cx.fill();
  }
  cx.globalAlpha = 1;
  
  // Floaters
  cx.textAlign = 'center';
  for(var i = 0; i < floaters.length; i++){
    var f = floaters[i];
    cx.globalAlpha = Math.max(0, f.life / f.max);
    cx.fillStyle = f.color;
    cx.font = '900 ' + f.size + 'px sans-serif';
    cx.shadowColor = f.color;
    cx.shadowBlur = 12;
    cx.fillText(f.text, f.x, f.y);
  }
  cx.shadowBlur = 0;
  cx.globalAlpha = 1;
  
  cx.restore();
  
  if(flash > 0){
    cx.fillStyle = 'rgba(255,120,120,' + Math.min(1, flash) + ')';
    cx.fillRect(0, 0, W, H);
  }
}

function drawWater(){
  var t = gameTime;
  var pts = [];
  for(var x = 0; x <= W + 3; x += 3){
    var y = waterY;
    y += Math.sin((x + t * 32) * .004 - t * 1.1) * 9;
    y += Math.sin((x - t * 22) * .009 + t * 1.8) * 5;
    y += Math.sin((x + t * 42) * .017 - t * 2.6) * 2.5;
    y += Math.sin(x * .026 + t * 3.4) * 1.6;
    pts.push({x: x, y: y});
  }
  
  function path(){
    cx.beginPath();
    cx.moveTo(0, H);
    cx.lineTo(pts[0].x, pts[0].y);
    for(var i = 1; i < pts.length; i++) cx.lineTo(pts[i].x, pts[i].y);
    cx.lineTo(pts[pts.length-1].x, H);
    cx.closePath();
  }
  
  var g = cx.createLinearGradient(0, waterY - 30, 0, H);
  g.addColorStop(0, 'rgba(95,200,250,.65)');
  g.addColorStop(.1, 'rgba(50,160,230,.82)');
  g.addColorStop(.3, 'rgba(22,100,190,.92)');
  g.addColorStop(.6, 'rgba(10,55,140,.96)');
  g.addColorStop(.85, 'rgba(4,25,85,.98)');
  g.addColorStop(1, 'rgba(1,8,35,.99)');
  path();
  cx.fillStyle = g;
  cx.fill();
  
  // Highlights
  cx.save();
  cx.globalCompositeOperation = 'lighter';
  cx.lineCap = 'round';
  cx.beginPath();
  for(var i = 0; i < pts.length; i++){
    if(i === 0) cx.moveTo(pts[i].x, pts[i].y - 4);
    else cx.lineTo(pts[i].x, pts[i].y - 4);
  }
  cx.strokeStyle = 'rgba(120,210,255,.3)';
  cx.lineWidth = 14;
  cx.stroke();
  
  cx.beginPath();
  for(var i = 0; i < pts.length; i++){
    if(i === 0) cx.moveTo(pts[i].x, pts[i].y - 2);
    else cx.lineTo(pts[i].x, pts[i].y - 2);
  }
  cx.strokeStyle = 'rgba(180,235,255,.55)';
  cx.lineWidth = 5;
  cx.stroke();
  
  cx.beginPath();
  for(var i = 0; i < pts.length; i++){
    if(i === 0) cx.moveTo(pts[i].x, pts[i].y - .5);
    else cx.lineTo(pts[i].x, pts[i].y - .5);
  }
  cx.strokeStyle = 'rgba(240,250,255,.95)';
  cx.lineWidth = 1.8;
  cx.stroke();
  
  // Glitter
  for(var g2 = 0; g2 < 25; g2++){
    var sx = (g2 * 61 + t * 55) % W;
    var idx = Math.floor(sx / 3);
    if(idx >= 0 && idx < pts.length){
      var sy = pts[idx].y;
      var tw = Math.abs(Math.sin(t * 3.5 + g2 * 1.7));
      if(tw > .55){
        cx.fillStyle = 'rgba(255,255,255,' + Math.min(1, (tw - .55) * 1.8) + ')';
        cx.beginPath();
        cx.arc(sx, sy - 1, 1.5 + Math.sin(t * 5 + g2) * .5, 0, 6.28);
        cx.fill();
      }
    }
  }
  cx.restore();
}

function drawObs(o){
  var p = Math.sin(o.pulse) * .35 + .65;
  var by = o.gapY + o.gapHeight;
  
  function pillar(y, h, isTop){
    if(h <= 0) return;
    cx.fillStyle = 'hsla(' + o.hue + ',100%,60%,' + (.1 * p) + ')';
    cx.fillRect(o.x - 6, y, o.width + 12, h);
    
    var g = cx.createLinearGradient(o.x, 0, o.x + o.width, 0);
    g.addColorStop(0, 'hsla(' + o.hue + ',70%,22%,.95)');
    g.addColorStop(.3, 'hsla(' + o.hue + ',80%,38%,.98)');
    g.addColorStop(.5, 'hsla(' + o.hue + ',90%,50%,1)');
    g.addColorStop(.7, 'hsla(' + o.hue + ',80%,38%,.98)');
    g.addColorStop(1, 'hsla(' + o.hue + ',70%,22%,.95)');
    cx.fillStyle = g;
    cx.fillRect(o.x, y, o.width, h);
    
    cx.fillStyle = 'hsla(' + o.hue + ',100%,70%,' + (.4 * p) + ')';
    cx.fillRect(o.x + o.width * .5 - 1, y, 2, h);
    
    var cy = isTop ? y + h - 4 : y;
    var cg = cx.createLinearGradient(o.x, cy, o.x, cy + 4);
    cg.addColorStop(0, 'hsla(' + o.hue + ',100%,78%,' + (.9 * p) + ')');
    cg.addColorStop(1, 'hsla(' + o.hue + ',100%,50%,0)');
    cx.fillStyle = cg;
    cx.fillRect(o.x, cy, o.width, 4);
    
    cx.strokeStyle = 'hsla(' + o.hue + ',100%,72%,' + (.5 * p) + ')';
    cx.lineWidth = 1.5;
    cx.strokeRect(o.x + .5, y + .5, o.width - 1, h - 1);
  }
  
  pillar(0, o.gapY, true);
  pillar(by, H - by, false);
}

function drawBub(b){
  var px = b.x;
  var py = b.y + Math.sin(b.bob) * 5;
  var pulse = Math.sin(b.pulse) * .3 + .7;
  
  // Glow
  cx.save();
  cx.globalCompositeOperation = 'lighter';
  var gr = b.r * 2.8;
  var g = cx.createRadialGradient(px, py, 2, px, py, gr);
  if(b.isSuper){
    g.addColorStop(0, 'rgba(255,120,220,' + (.65 * pulse) + ')');
    g.addColorStop(.4, 'rgba(140,120,255,' + (.35 * pulse) + ')');
  } else {
    g.addColorStop(0, 'rgba(255,215,0,' + (.55 * pulse) + ')');
    g.addColorStop(.5, 'rgba(255,180,0,' + (.2 * pulse) + ')');
  }
  g.addColorStop(1, 'rgba(255,215,0,0)');
  cx.fillStyle = g;
  cx.beginPath();
  cx.arc(px, py, gr, 0, 6.28);
  cx.fill();
  cx.restore();
  
  // Body
  var bg = cx.createRadialGradient(px - b.r * .35, py - b.r * .4, b.r * .1, px, py, b.r);
  if(b.isSuper){
    bg.addColorStop(0, '#fff');
    bg.addColorStop(.25, '#ff80ff');
    bg.addColorStop(.5, '#8080ff');
    bg.addColorStop(.75, '#80d0ff');
    bg.addColorStop(1, '#ff80d0');
  } else {
    bg.addColorStop(0, 'rgba(255,255,240,1)');
    bg.addColorStop(.35, 'rgba(255,235,120,.95)');
    bg.addColorStop(.75, 'rgba(255,190,40,.9)');
    bg.addColorStop(1, 'rgba(210,140,0,.85)');
  }
  cx.fillStyle = bg;
  cx.beginPath();
  cx.arc(px, py, b.r, 0, 6.28);
  cx.fill();
  
  // Highlight
  cx.fillStyle = 'rgba(255,255,255,.9)';
  cx.beginPath();
  cx.arc(px - b.r * .32, py - b.r * .35, b.r * .25, 0, 6.28);
  cx.fill();
}

function drawBoat(){
  var pal = palettes[selBoat] || palettes.classic;
  cx.save();
  cx.translate(boat.x, boat.y);
  cx.rotate(boat.angle);
  
  var hullG = cx.createLinearGradient(0, 0, 0, BOAT_H * .55);
  hullG.addColorStop(0, pal.top);
  hullG.addColorStop(.3, pal.mid);
  hullG.addColorStop(.65, pal.dark);
  hullG.addColorStop(1, pal.bottom);
  
  // Glow
  cx.save();
  cx.globalCompositeOperation = 'lighter';
  var gg = cx.createRadialGradient(0, 0, 2, 0, 0, 55);
  gg.addColorStop(0, pal.glow);
  gg.addColorStop(1, 'rgba(0,0,0,0)');
  cx.fillStyle = gg;
  cx.beginPath();
  cx.arc(0, 0, 55, 0, 6.28);
  cx.fill();
  cx.restore();
  
  // Hull
  cx.beginPath();
  cx.moveTo(-BOAT_W * .55, 0);
  cx.quadraticCurveTo(-BOAT_W * .55, BOAT_H * .55, 0, BOAT_H * .55);
  cx.quadraticCurveTo(BOAT_W * .55, BOAT_H * .55, BOAT_W * .55, 0);
  cx.closePath();
  cx.fillStyle = hullG;
  cx.fill();
  cx.strokeStyle = 'rgba(255,220,180,.75)';
  cx.lineWidth = 1.3;
  cx.stroke();
  
  // Planks
  for(var i = 1; i <= 3; i++){
    var py = (BOAT_H * .55) * (i / 4);
    cx.strokeStyle = 'rgba(30,15,5,.55)';
    cx.lineWidth = .9;
    cx.beginPath();
    cx.moveTo(-BOAT_W * .5, py);
    cx.quadraticCurveTo(0, py + 2, BOAT_W * .5, py);
    cx.stroke();
  }
  
  // Stripe
  cx.fillStyle = pal.stripe;
  cx.fillRect(-BOAT_W * .52, 0, BOAT_W * 1.04, 2.5);
  
  // Deck
  cx.beginPath();
  cx.moveTo(-BOAT_W * .55, 0);
  cx.lineTo(BOAT_W * .55, 0);
  cx.strokeStyle = 'rgba(255,245,220,.95)';
  cx.lineWidth = 2.3;
  cx.stroke();
  
  // Cabin
  cx.beginPath();
  cx.moveTo(-BOAT_W * .1, 0);
  cx.lineTo(-BOAT_W * .1, -BOAT_H * .42);
  cx.lineTo(BOAT_W * .15, -BOAT_H * .42);
  cx.lineTo(BOAT_W * .15, 0);
  cx.closePath();
  var cabG = cx.createLinearGradient(-BOAT_W * .1, -BOAT_H * .42, BOAT_W * .15, 0);
  cabG.addColorStop(0, pal.mid);
  cabG.addColorStop(.5, pal.top);
  cabG.addColorStop(1, pal.dark);
  cx.fillStyle = cabG;
  cx.fill();
  cx.strokeStyle = 'rgba(255,220,180,.6)';
  cx.lineWidth = 1;
  cx.stroke();
  
  // Window
  cx.fillStyle = 'rgba(255,240,150,1)';
  cx.shadowColor = 'rgba(255,220,100,.95)';
  cx.shadowBlur = 12;
  cx.fillRect(-BOAT_W * .06, -BOAT_H * .34, BOAT_W * .16, BOAT_H * .16);
  cx.shadowBlur = 0;
  
  // Mast
  cx.beginPath();
  cx.moveTo(BOAT_W * .22, 0);
  cx.lineTo(BOAT_W * .22, -BOAT_H * 1.55);
  cx.strokeStyle = '#3a2410';
  cx.lineWidth = 2.5;
  cx.stroke();
  
  // Sail
  cx.beginPath();
  cx.moveTo(BOAT_W * .22, -BOAT_H * .15);
  cx.quadraticCurveTo(-BOAT_W * .05, -BOAT_H * .75, BOAT_W * .05, -BOAT_H * 1.42);
  cx.lineTo(BOAT_W * .22, -BOAT_H * 1.5);
  cx.closePath();
  var sailG = cx.createLinearGradient(BOAT_W * .22, -BOAT_H * 1.5, 0, 0);
  sailG.addColorStop(0, '#fff');
  sailG.addColorStop(.45, pal.sail);
  sailG.addColorStop(1, pal.dark);
  cx.fillStyle = sailG;
  cx.shadowColor = pal.glow;
  cx.shadowBlur = 12;
  cx.fill();
  cx.shadowBlur = 0;
  cx.strokeStyle = 'rgba(255,255,255,.7)';
  cx.lineWidth = .9;
  cx.stroke();
  
  // Flag
  cx.beginPath();
  cx.moveTo(BOAT_W * .22, -BOAT_H * 1.58);
  cx.lineTo(BOAT_W * .52, -BOAT_H * 1.46);
  cx.lineTo(BOAT_W * .22, -BOAT_H * 1.34);
  cx.closePath();
  cx.fillStyle = pal.flag;
  cx.fill();
  
  // Lantern
  var lp = .85 + Math.sin(gameTime * 4) * .15;
  cx.fillStyle = 'rgba(255,220,90,' + lp + ')';
  cx.shadowColor = 'rgba(255,210,80,.95)';
  cx.shadowBlur = 16;
  cx.beginPath();
  cx.arc(BOAT_W * .22, -BOAT_H * 1.6, 3, 0, 6.28);
  cx.fill();
  cx.shadowBlur = 0;
  
  cx.restore();
}

// ---------- LOOP ----------
var lastTime = performance.now();
function loop(now){
  var dt = Math.min((now - lastTime) / 1000, .05);
  lastTime = now;
  try {
    if(state === S.PLAY || state === S.MENU || state === S.OVER) update(dt);
    else gameTime += dt * .001;
    render();
  } catch(e){
    console.error('LOOP ERROR:', e);
  }
  requestAnimationFrame(loop);
}

// ---------- EVENTS ----------
$('play').addEventListener('click', startGame);
$('retry').addEventListener('click', startGame);
$('to-menu').addEventListener('click', toMenu);
$('pause').addEventListener('click', pauseGame);
$('resume').addEventListener('click', resumeGame);
$('quit').addEventListener('click', toMenu);
$('shop-btn').addEventListener('click', openShop);
$('shop-back').addEventListener('click', closeShop);
$('tab-boats').addEventListener('click', function(){ curTab = 'boats'; renderShop(); });
$('tab-walls').addEventListener('click', function(){ curTab = 'walls'; renderShop(); });

// Input
function down(e){
  if(e && e.preventDefault) e.preventDefault();
  if(state === S.PLAY) holding = true;
}
function up(e){
  if(e && e.preventDefault) e.preventDefault();
  holding = false;
}
cv.addEventListener('pointerdown', down, {passive: false});
window.addEventListener('pointerup', up, {passive: false});
window.addEventListener('pointercancel', up, {passive: false});
cv.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive: false});

$('admin-btn').addEventListener('click', function(){
  $('admin-login').classList.remove('hide');
  $('code').value = '';
  $('err').textContent = '';

});

});

  if(e.key === 'Enter'){ e.preventDefault(); tryLogin(); }
});

  var c = ($('code').value || '').trim().toUpperCase();
  if(c === ADMIN){
    $('admin-login').classList.add('hide');
    $('admin-panel').classList.remove('hide');
    updCoins();
  } else {
    $('err').textContent = '❌ Falscher Code';
    $('code').value = '';
    $('code').focus();
  }
}
$('admin-close').addEventListener('click', function(){
  $('admin-panel').classList.add('hide');
  updCoins();
});

var adBtns = document.querySelectorAll('[data-ad]');
for(var i = 0; i < adBtns.length; i++){
  adBtns[i].addEventListener('click', function(){
    var a = this.dataset.ad;
    if(a === 'c1000'){ coins += 1000; save(); updCoins(); }
    else if(a === 'c9999'){ coins += 9999; save(); updCoins(); }
    else if(a === 'skins'){
      owned.boats = ['classic','pirate','crystal','golden'];
      owned.walls = ['crystal','neon','lava','ice'];
      save(); updCoins();
      if(curTab) renderShop();
    }
    else if(a === 'hs9999'){
      highscore = 9999; save();
      $('hs').textContent = '9999';
    }
    else if(a === 'c0'){ coins = 0; save(); updCoins(); }
    else if(a === 'reset'){
      if(confirm('Wirklich alles zurücksetzen?')){
        coins = 0; highscore = 0;
        owned = { boats:['classic'], walls:['crystal'] };
        selBoat = 'classic'; selWall = 'crystal';
        save(); updCoins();
        $('hs').textContent = '0';
        if(curTab) renderShop();
      }
    }
  });
}

updCoins();

waterVel = 0;

boat.y = waterY - BOAT_H * .4;

})();
