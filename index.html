<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1128">
<title>TIDAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#game-container{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(10,30,60,.85),rgba(5,10,25,.95));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:10;padding:24px;transition:opacity .4s ease;overflow-y:auto}
.overlay.hidden{opacity:0;pointer-events:none}
#langBar{position:absolute;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));display:flex;gap:8px;z-index:20}
.langBtn{width:42px;height:42px;border-radius:50%;padding:0;min-width:unset;font-size:12px;font-weight:800;background:rgba(255,255,255,.08);color:#8ab4d8;border:1.5px solid rgba(168,240,255,.25);box-shadow:none;margin:0;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;font-family:inherit}
.langBtn.active{background:linear-gradient(135deg,#4dc8ff,#1a8cd8);color:#001a2e;border-color:#4dc8ff;box-shadow:0 0 20px rgba(77,200,255,.7)}
h1.title{font-size:clamp(56px,16vw,130px);font-weight:900;letter-spacing:.15em;background:linear-gradient(180deg,#d0faff,#4dc8ff 40%,#1a6fd8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(77,200,255,.7));margin-bottom:6px;animation:titlePulse 3s ease-in-out infinite}
@keyframes titlePulse{0%,100%{filter:drop-shadow(0 0 30px rgba(77,200,255,.7))}50%{filter:drop-shadow(0 0 60px rgba(77,200,255,1))}}
h2{font-size:clamp(32px,9vw,60px);font-weight:900;letter-spacing:.1em;color:#ff6b6b;text-shadow:0 0 30px rgba(255,107,107,.8);margin-bottom:24px;text-align:center}
.subtitle{font-size:clamp(13px,3.6vw,17px);color:#8ab4d8;margin-bottom:28px;letter-spacing:.15em;text-align:center;line-height:1.6}
button{font-family:inherit;font-size:clamp(16px,4vw,20px);font-weight:700;letter-spacing:.2em;padding:16px 48px;border:none;border-radius:14px;background:linear-gradient(135deg,#4dc8ff,#1a8cd8);color:#001a2e;cursor:pointer;box-shadow:0 6px 30px rgba(77,200,255,.5),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s,box-shadow .15s;margin:8px;min-width:180px}
button:active{transform:scale(.97)}
button.secondary{background:rgba(255,255,255,.08);color:#cfe8ff;box-shadow:0 4px 20px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.1);border:1px solid rgba(168,240,255,.25)}
#shopBtn{background:rgba(255,215,0,.15);border:1.5px solid rgba(255,215,0,.5);color:#ffd700;font-size:16px;padding:12px 32px;min-width:180px;margin-top:0;box-shadow:0 0 20px rgba(255,215,0,.3)}
.menu-coins{margin-top:16px;font-size:20px;color:#ffd700;font-weight:900;text-shadow:0 0 15px rgba(255,215,0,.6)}
.menu-highscore{margin-top:16px;font-size:14px;color:#ffd700;letter-spacing:.15em;text-shadow:0 0 15px rgba(255,215,0,.4)}
#hud{position:absolute;inset:0;pointer-events:none;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
#hud.hidden{display:none}
#score{font-size:clamp(32px,8vw,46px);font-weight:900;color:#d0faff;text-shadow:0 0 24px rgba(77,200,255,.9),0 0 8px rgba(77,200,255,.6);letter-spacing:.05em;font-variant-numeric:tabular-nums}
#pauseBtn{pointer-events:auto;width:52px;height:52px;border-radius:50%;padding:0;font-size:22px;display:flex;align-items:center;justify-content:center;min-width:unset;background:rgba(255,255,255,.12);border:1px solid rgba(168,240,255,.3);color:#fff;box-shadow:0 0 15px rgba(77,200,255,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.score-display{background:linear-gradient(180deg,rgba(77,200,255,.1),rgba(26,140,216,.05));border:1px solid rgba(77,200,255,.35);border-radius:20px;padding:28px 48px;margin-bottom:24px;text-align:center;box-shadow:0 0 40px rgba(77,200,255,.15),inset 0 0 30px rgba(77,200,255,.05)}
.score-label{font-size:13px;color:#8ab4d8;letter-spacing:.4em;margin-bottom:6px}
.score-value{font-size:clamp(48px,14vw,72px);font-weight:900;color:#d0faff;text-shadow:0 0 30px rgba(77,200,255,.9);font-variant-numeric:tabular-nums;line-height:1}
.highscore-label{margin-top:20px;font-size:13px;color:#ffd700;letter-spacing:.2em;text-shadow:0 0 15px rgba(255,215,0,.5)}
.highscore-value{color:#ffd700;font-weight:800}
.coins-earned{margin-top:16px;font-size:18px;color:#ffd700;font-weight:900;text-shadow:0 0 15px rgba(255,215,0,.7)}
.instructions{margin-top:24px;font-size:14px;color:#8ab4d8;text-align:center;line-height:1.9;max-width:440px;padding:16px;border-top:1px solid rgba(77,200,255,.15)}
.instructions .gesture{display:inline-block;padding:2px 10px;background:rgba(77,200,255,.15);border:1px solid rgba(77,200,255,.4);border-radius:6px;font-size:12px;color:#a8f0ff;margin:0 2px}
.super-line{color:#ff80ff;font-weight:700;margin-top:10px;text-shadow:0 0 10px rgba(255,128,255,.5)}
#tutorialHint{position:absolute;left:50%;bottom:25%;transform:translateX(-50%);font-size:clamp(16px,4vw,20px);font-weight:700;color:#d0faff;letter-spacing:.15em;text-shadow:0 0 20px rgba(77,200,255,.9);pointer-events:none;z-index:6;opacity:0;transition:opacity .6s;text-align:center;white-space:nowrap}
#tutorialHint.visible{opacity:1;animation:hintPulse 1.4s ease-in-out infinite}
@keyframes hintPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}}
.shop-coins{font-size:24px;color:#ffd700;font-weight:900;margin-bottom:16px;text-shadow:0 0 20px rgba(255,215,0,.7)}
.shop-tabs{display:flex;gap:8px;margin-bottom:16px}
.shopTab{padding:10px 24px;border-radius:10px;background:rgba(255,255,255,.08);color:#8ab4d8;border:1px solid rgba(168,240,255,.25);cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.1em;min-width:unset;box-shadow:none;margin:0;font-family:inherit}
.shopTab.active{background:linear-gradient(135deg,#4dc8ff,#1a8cd8);color:#001a2e;border-color:#4dc8ff;box-shadow:0 0 20px rgba(77,200,255,.6)}
.shop-content{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;width:100%;max-width:640px;max-height:55vh;overflow-y:auto;padding:8px;margin-bottom:16px}
.shop-item{background:rgba(255,255,255,.05);border:1.5px solid rgba(168,240,255,.2);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s}
.shop-item.active{border-color:#4dc8ff;box-shadow:0 0 20px rgba(77,200,255,.5);background:rgba(77,200,255,.08)}
.shop-preview{width:100%;height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:34px}
.shop-preview.boats-classic{background:linear-gradient(180deg,#e8b878,#4a2208)}
.shop-preview.boats-pirate{background:linear-gradient(180deg,#3a3a3a,#000)}
.shop-preview.boats-crystal{background:linear-gradient(180deg,#a0f0ff,#0080ff);box-shadow:inset 0 0 20px rgba(100,220,255,.8)}
.shop-preview.boats-golden{background:linear-gradient(180deg,#fff5a0,#c08020);box-shadow:inset 0 0 20px rgba(255,215,0,.6)}
.shop-preview.walls-crystal{background:linear-gradient(180deg,#80ffcc,#008888)}
.shop-preview.walls-neon{background:linear-gradient(180deg,#ff80ff,#800080)}
.shop-preview.walls-lava{background:linear-gradient(180deg,#ffcc00,#ff2200)}
.shop-preview.walls-ice{background:linear-gradient(180deg,#e0f8ff,#6090d0)}
.shop-item-name{font-size:13px;font-weight:700;color:#d0faff;text-align:center}
.shop-item-desc{font-size:11px;color:#8ab4d8;text-align:center}
.shop-btn{width:100%;padding:8px 10px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.05em;cursor:pointer;border:none;min-width:unset;margin:0;box-shadow:none;font-family:inherit;color:#fff}
.shop-btn.buy{background:linear-gradient(135deg,#ffd700,#cc8800);color:#2a1800;box-shadow:0 0 15px rgba(255,215,0,.5)}
.shop-btn.owned{background:rgba(100,200,255,.2);color:#d0faff;border:1px solid rgba(168,240,255,.4)}
.shop-btn.selected{background:rgba(80,200,100,.3);color:#a0ffa0;border:1px solid rgba(100,255,100,.5)}
.shop-btn:disabled{opacity:.35;cursor:not-allowed}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="score">0</div>
    <button id="pauseBtn" aria-label="Pause">⏸</button>
  </div>

  <div id="tutorialHint"></div>

  <div id="menu" class="overlay">
    <div id="langBar">
      <button class="langBtn active" data-lang="de">DE</button>
      <button class="langBtn" data-lang="en">EN</button>
      <button class="langBtn" data-lang="es">ES</button>
      <button class="langBtn" data-lang="fr">FR</button>
    </div>
    <h1 class="title">TIDAL</h1>
    <p class="subtitle" id="menuSubtitle">STEUERE DAS WASSER.<br>NICHT DAS BOOT.</p>
    <button id="playBtn">▶ SPIELEN</button>
    <button id="shopBtn">🛒 SHOP</button>
    <div class="menu-coins">💰 <span id="menuCoins">0</span></div>
    <div class="menu-highscore"><span id="menuHsLabel">HIGHSCORE</span>: <span id="menuHighscore">0</span></div>
    <div class="instructions">
      <span class="gesture" id="holdBadge">GEDRÜCKT HALTEN</span> → <span id="riseText">Wasser steigt</span><br>
      <span class="gesture" id="releaseBadge">LOSLASSEN</span> → <span id="fallText">Wasser sinkt</span><br><br>
      <span id="goalText">Manövriere dein Boot durch die Lücken.</span>
      <div class="super-line" id="superText">⭐ Regenbogen-Bubbles = +25 Punkte</div>
    </div>
  </div>

  <div id="shop" class="overlay hidden">
    <h2 id="shopTitle" style="color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,.8)">SHOP</h2>
    <div class="shop-coins">💰 <span id="shopCoins">0</span></div>
    <div class="shop-tabs">
      <button class="shopTab active" data-tab="boats" id="shopBoatsTab">BOOTE</button>
      <button class="shopTab" data-tab="walls" id="shopWallsTab">WÄNDE</button>
    </div>
    <div id="shopContent" class="shop-content"></div>
    <button id="closeShopBtn" class="secondary">ZURÜCK</button>
  </div>

  <div id="gameover" class="overlay hidden">
    <h2 id="goTitle">GAME OVER</h2>
    <div class="score-display">
      <div class="score-label" id="goPointsLabel">PUNKTE</div>
      <div class="score-value" id="finalScore">0</div>
      <div class="highscore-label"><span id="goHsLabel">HIGHSCORE</span>: <span class="highscore-value" id="finalHighscore">0</span></div>
      <div class="coins-earned">💰 +<span id="goCoinsEarned">0</span></div>
    </div>
    <button id="retryBtn">NOCHMAL</button>
    <button id="menuBtn" class="secondary">MENÜ</button>
  </div>

  <div id="pause" class="overlay hidden">
    <h2 id="pauseTitle" style="color:#d0faff;text-shadow:0 0 30px rgba(77,200,255,.7)">PAUSE</h2>
    <button id="resumeBtn">WEITER</button>
    <button id="quitBtn" class="secondary">MENÜ</button>
  </div>
</div>

<script>
(function(){
'use strict';

var $ = function(id){ return document.getElementById(id); };
var canvas = $('game');
var ctx = canvas.getContext('2d');
var container = $('game-container');
var STATE = { MENU: 'menu', PLAYING: 'playing', PAUSED: 'paused', GAMEOVER: 'gameover' };
var state = STATE.MENU;
var W = 0, H = 0, DPR = 1;
var waterY = 0, waterVel = 0, holding = false, gameTime = 0;
var scrollSpeed = 260, score = 0, distance = 0;
var highscore = parseInt(localStorage.getItem('tidal_highscore') || '0', 10);
var screenShake = 0, flashAlpha = 0;
var boat = { x: 0, y: 0, angle: 0 };
var obstacles = [], bubbles = [], particles = [], floaters = [];
var obstacleSpawnTimer = 0, bubbleSpawnTimer = 0, tutorialTimer = 0;
var lastTime = performance.now();
var WATER_RISE_SPEED = 420, WATER_FALL_SPEED = 320;
var WATER_RISE_RESPONSIVENESS = 10, WATER_FALL_RESPONSIVENESS = 6;
var WATER_MAX_SPEED = 520;
var BOAT_W = 56, BOAT_H = 38;
var BUBBLE_RADIUS = 17, SUPER_BUBBLE_RADIUS = 26;
var SUPER_BUBBLE_CHANCE = 0.06, BUBBLE_WALL_MARGIN = 40;

// ============ SHOP STATE ============
var coins = parseInt(localStorage.getItem('tidal_coins') || '0', 10);
var ownedSkins = { boats: ['classic'], walls: ['crystal'] };
try {
  var savedOwned = JSON.parse(localStorage.getItem('tidal_owned') || 'null');
  if (savedOwned && savedOwned.boats && savedOwned.walls) {
    ownedSkins = savedOwned;
    if (ownedSkins.boats.indexOf('classic') < 0) ownedSkins.boats.push('classic');
    if (ownedSkins.walls.indexOf('crystal') < 0) ownedSkins.walls.push('crystal');
  }
} catch(e) {}
var selectedBoat = localStorage.getItem('tidal_boat') || 'classic';
var selectedWall = localStorage.getItem('tidal_wall') || 'crystal';
var currentShopTab = 'boats';
if (ownedSkins.boats.indexOf(selectedBoat) < 0) selectedBoat = 'classic';
if (ownedSkins.walls.indexOf(selectedWall) < 0) selectedWall = 'crystal';

function saveProgress(){
  try {
    localStorage.setItem('tidal_coins', String(coins));
    localStorage.setItem('tidal_owned', JSON.stringify(ownedSkins));
    localStorage.setItem('tidal_boat', selectedBoat);
    localStorage.setItem('tidal_wall', selectedWall);
  } catch(e) {}
}
function updateMenuCoins(){ $('menuCoins').textContent = coins; }

var shopItems = {
  boats: [
    {id:'classic', name:'Holzschiff', desc:'Klassisch', price:0, emoji:'🛶'},
    {id:'pirate', name:'Piratenschiff', desc:'Dunkel & gefährlich', price:100, emoji:'🏴‍☠️'},
    {id:'crystal', name:'Kristallboot', desc:'Leuchtet blau', price:250, emoji:'💎'},
    {id:'golden', name:'Goldboot', desc:'Reiner Luxus', price:500, emoji:'👑'}
  ],
  walls: [
    {id:'crystal', name:'Kristall-Türkis', desc:'Standard', price:0, emoji:'💠'},
    {id:'neon', name:'Neon Pink', desc:'Knallig pink', price:75, emoji:'💜'},
    {id:'lava', name:'Lava', desc:'Glühend heiß', price:150, emoji:'🔥'},
    {id:'ice', name:'Eisblau', desc:'Kalt & klar', price:300, emoji:'❄️'}
  ]
};

function applyWallSkin(obs){
  if (selectedWall === 'neon') obs.hue = 300 + Math.random() * 30;
  else if (selectedWall === 'lava') obs.hue = 5 + Math.random() * 25;
  else if (selectedWall === 'ice') obs.hue = 200 + Math.random() * 20;
}

// ============ BUTTONS (sofort registrieren!) ============
$('playBtn').addEventListener('click', function(){ if(typeof startGame==='function') startGame(); });
$('retryBtn').addEventListener('click', function(){ if(typeof startGame==='function') startGame(); });
$('menuBtn').addEventListener('click', function(){ if(typeof goToMenu==='function') goToMenu(); });
$('pauseBtn').addEventListener('click', function(){ if(typeof pauseGame==='function') pauseGame(); });
$('resumeBtn').addEventListener('click', function(){ if(typeof resumeGame==='function') resumeGame(); });
$('quitBtn').addEventListener('click', function(){ if(typeof goToMenu==='function') goToMenu(); });
$('shopBtn').addEventListener('click', function(){ if(typeof openShop==='function') openShop(); });
$('closeShopBtn').addEventListener('click', function(){ if(typeof closeShop==='function') closeShop(); });

var shopTabBtns = document.querySelectorAll('.shopTab');
for(var st=0; st<shopTabBtns.length; st++){
  shopTabBtns[st].addEventListener('click', function(){ if(typeof switchShopTab==='function') switchShopTab(this.dataset.tab); });
}

// ============ SPRACHEN ============
var translations = {
  de:{subtitle:"STEUERE DAS WASSER.<br>NICHT DAS BOOT.",play:"▶ SPIELEN",shop:"🛒 SHOP",highscore:"HIGHSCORE",hold:"GEDRÜCKT HALTEN",release:"LOSLASSEN",rise:"Wasser steigt",fall:"Wasser sinkt",goal:"Manövriere dein Boot durch die Lücken.",super:"⭐ Regenbogen-Bubbles = +25 Punkte",gameover:"GAME OVER",points:"PUNKTE",retry:"NOCHMAL",menu:"MENÜ",pause:"PAUSE",continueBtn:"WEITER",hint:"GEDRÜCKT HALTEN",shopTitle:"SHOP",shopBoats:"BOOTE",shopWalls:"WÄNDE",shopBack:"ZURÜCK",shopSelect:"AUSWÄHLEN",shopSelected:"✓ AUSGEWÄHLT"},
  en:{subtitle:"CONTROL THE WATER.<br>NOT THE BOAT.",play:"▶ PLAY",shop:"🛒 SHOP",highscore:"HIGHSCORE",hold:"HOLD PRESSED",release:"RELEASE",rise:"water rises",fall:"water falls",goal:"Navigate your boat through the gaps.",super:"⭐ Rainbow bubbles = +25 points",gameover:"GAME OVER",points:"POINTS",retry:"RETRY",menu:"MENU",pause:"PAUSE",continueBtn:"CONTINUE",hint:"HOLD PRESSED",shopTitle:"SHOP",shopBoats:"BOATS",shopWalls:"WALLS",shopBack:"BACK",shopSelect:"SELECT",shopSelected:"✓ SELECTED"},
  es:{subtitle:"CONTROLA EL AGUA.<br>NO EL BARCO.",play:"▶ JUGAR",shop:"🛒 TIENDA",highscore:"RÉCORD",hold:"MANTÉN PULSADO",release:"SUELTA",rise:"el agua sube",fall:"el agua baja",goal:"Navega tu barco por los huecos.",super:"⭐ Burbujas arcoíris = +25 puntos",gameover:"FIN DEL JUEGO",points:"PUNTOS",retry:"OTRA VEZ",menu:"MENÚ",pause:"PAUSA",continueBtn:"CONTINUAR",hint:"MANTÉN PULSADO",shopTitle:"TIENDA",shopBoats:"BARCOS",shopWalls:"MUROS",shopBack:"VOLVER",shopSelect:"ELEGIR",shopSelected:"✓ ELEGIDO"},
  fr:{subtitle:"CONTRÔLE L'EAU.<br>PAS LE BATEAU.",play:"▶ JOUER",shop:"🛒 BOUTIQUE",highscore:"RECORD",hold:"MAINTENIR",release:"RELÂCHER",rise:"l'eau monte",fall:"l'eau descend",goal:"Navigue ton bateau entre les brèches.",super:"⭐ Bulles arc-en-ciel = +25 points",gameover:"PARTIE TERMINÉE",points:"POINTS",retry:"REJOUER",menu:"MENU",pause:"PAUSE",continueBtn:"CONTINUER",hint:"MAINTENIR",shopTitle:"BOUTIQUE",shopBoats:"BATEAUX",shopWalls:"MURS",shopBack:"RETOUR",shopSelect:"CHOISIR",shopSelected:"✓ CHOISI"}
};
var currentLang = localStorage.getItem('tidal_lang') || 'de';
if(!translations[currentLang]) currentLang = 'de';

function applyLanguage(lang){
  if(!translations[lang]) return;
  currentLang = lang;
  try{ localStorage.setItem('tidal_lang', lang); }catch(e){}
  var t = translations[lang];
  $('menuSubtitle').innerHTML = t.subtitle;
  $('playBtn').textContent = t.play;
  $('shopBtn').textContent = t.shop;
  $('menuHsLabel').textContent = t.highscore;
  $('holdBadge').textContent = t.hold;
  $('releaseBadge').textContent = t.release;
  $('riseText').textContent = t.rise;
  $('fallText').textContent = t.fall;
  $('goalText').textContent = t.goal;
  $('superText').textContent = t.super;
  $('goTitle').textContent = t.gameover;
  $('goPointsLabel').textContent = t.points;
  $('goHsLabel').textContent = t.highscore;
  $('retryBtn').textContent = t.retry;
  $('menuBtn').textContent = t.menu;
  $('pauseTitle').textContent = t.pause;
  $('resumeBtn').textContent = t.continueBtn;
  $('quitBtn').textContent = t.menu;
  $('shopTitle').textContent = t.shopTitle;
  $('shopBoatsTab').textContent = t.shopBoats;
  $('shopWallsTab').textContent = t.shopWalls;
  $('closeShopBtn').textContent = t.shopBack;
  var lb = document.querySelectorAll('.langBtn');
  for(var i=0;i<lb.length;i++){
    if(lb[i].dataset.lang === lang) lb[i].classList.add('active');
    else lb[i].classList.remove('active');
  }
  document.documentElement.lang = lang;
  if (currentShopTab) renderShop();
}
var langBtns = document.querySelectorAll('.langBtn');
for(var i=0;i<langBtns.length;i++){
  langBtns[i].addEventListener('click', function(e){ e.stopPropagation(); applyLanguage(this.dataset.lang); });
}

// ============ SHOP LOGIK ============
function openShop(){
  $('menu').classList.add('hidden');
  $('shop').classList.remove('hidden');
  currentShopTab = 'boats';
  var tabs = document.querySelectorAll('.shopTab');
  for(var i=0;i<tabs.length;i++){
    if(tabs[i].dataset.tab === 'boats') tabs[i].classList.add('active');
    else tabs[i].classList.remove('active');
  }
  renderShop();
}
function closeShop(){
  $('shop').classList.add('hidden');
  $('menu').classList.remove('hidden');
  updateMenuCoins();
}
function switchShopTab(tab){
  currentShopTab = tab;
  var tabs = document.querySelectorAll('.shopTab');
  for(var i=0;i<tabs.length;i++){
    if(tabs[i].dataset.tab === tab) tabs[i].classList.add('active');
    else tabs[i].classList.remove('active');
  }
  renderShop();
}
function renderShop(){
  $('shopCoins').textContent = coins;
  var t = translations[currentLang];
  var items = shopItems[currentShopTab];
  var html = '';
  for(var i=0;i<items.length;i++){
    var item = items[i];
    var owned = ownedSkins[currentShopTab].indexOf(item.id) >= 0;
    var sel = (currentShopTab === 'boats' ? selectedBoat : selectedWall) === item.id;
    var label, cls, action, dis = '';
    if(sel){ label = t.shopSelected; cls = 'shop-btn selected'; action = 'none'; }
    else if(owned){ label = t.shopSelect; cls = 'shop-btn owned'; action = 'select'; }
    else { label = item.price + ' 💰'; cls = 'shop-btn buy'; action = 'buy'; if(coins < item.price) dis = ' disabled'; }
    html += '<div class="shop-item'+(sel?' active':'')+'">' +
      '<div class="shop-preview '+currentShopTab+'-'+item.id+'">'+item.emoji+'</div>' +
      '<div class="shop-item-name">'+item.name+'</div>' +
      '<div class="shop-item-desc">'+item.desc+'</div>' +
      '<button class="'+cls+'" data-action="'+action+'" data-tab="'+currentShopTab+'" data-id="'+item.id+'"'+dis+'>'+label+'</button>' +
      '</div>';
  }
  $('shopContent').innerHTML = html;
  var btns = $('shopContent').querySelectorAll('button');
  for(var j=0;j<btns.length;j++) btns[j].addEventListener('click', handleShopAction);
}
function handleShopAction(){
  var action = this.dataset.action;
  var tab = this.dataset.tab;
  var id = this.dataset.id;
  if(action === 'none') return;
  if(action === 'select'){
    if(tab === 'boats') selectedBoat = id;
    else selectedWall = id;
    saveProgress();
    renderShop();
  } else if(action === 'buy'){
    var item = null;
    for(var i=0;i<shopItems[tab].length;i++){
      if(shopItems[tab][i].id === id){ item = shopItems[tab][i]; break; }
    }
    if(!item || coins < item.price) return;
    coins -= item.price;
    ownedSkins[tab].push(id);
    if(tab === 'boats') selectedBoat = id;
    else selectedWall = id;
    saveProgress();
    updateMenuCoins();
    renderShop();
  }
}

// ============ RESIZE ============
function resize(){
  var rect = container.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width; H = rect.height;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 100); });
resize();

// ============ PARTIKEL ============
function spawnParticle(x,y,vx,vy,o){
  o = o || {};
  if(particles.length > 340) return;
  particles.push({x:x,y:y,vx:vx,vy:vy,life:o.life||1,maxLife:o.life||1,size:o.size||3,color:o.color||'rgba(168,240,255,0.8)',gravity:o.gravity||0});
}
function spawnDirectionalSplash(x, y, intensity, rising){
  var count = Math.max(1, Math.floor(intensity*9));
  for(var i=0;i<count;i++){
    if(rising){
      var a1 = -Math.PI/2 + (Math.random()-0.5)*Math.PI*0.9;
      var s1 = 90 + Math.random()*220*intensity;
      spawnParticle(x+(Math.random()-0.5)*BOAT_W*0.9, y+2+Math.random()*4, Math.cos(a1)*s1, Math.sin(a1)*s1,
        {life:0.5+Math.random()*0.35,size:1.5+Math.random()*2.2,color:'rgba(210,245,255,'+(0.7+Math.random()*0.3)+')',gravity:420});
    } else {
      var side = Math.random()<0.5?-1:1;
      var a2 = (side>0?0:Math.PI) + (Math.random()-0.5)*Math.PI*0.55;
      var s2 = 70 + Math.random()*170*intensity;
      spawnParticle(x+side*BOAT_W*0.42, y+3+Math.random()*5, Math.cos(a2)*s2, Math.sin(a2)*s2-30,
        {life:0.45+Math.random()*0.35,size:1.4+Math.random()*2.5,color:'rgba(190,235,255,'+(0.6+Math.random()*0.35)+')',gravity:340});
    }
  }
}
function spawnExplosion(x,y){
  for(var i=0;i<36;i++){
    var a = Math.random()*Math.PI*2, s = 100+Math.random()*380;
    spawnParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,
      {life:0.7+Math.random()*0.7,size:3+Math.random()*4,color:'rgba(255,'+((120+Math.random()*100)|0)+','+((100+Math.random()*100)|0)+',1)',gravity:220});
  }
}

// ============ HINDERNISSE ============
function Obstacle(x, gapY, gapHeight){
  this.x = x; this.gapY = gapY; this.gapHeight = gapHeight;
  this.width = Math.max(64, W*0.11);
  this.passed = false;
  this.hue = 175 + Math.random()*45;
  this.glowPulse = Math.random()*Math.PI*2;
}
function spawnObstacle(){
  var gapHeightFactor = Math.max(0.22, 0.38 - distance*0.0015);
  var gapHeight = H*gapHeightFactor;
  var minY = H*0.12, maxY = H*0.85 - gapHeight;
  var gapY = minY + Math.random()*Math.max(0, maxY-minY);
  var obs = new Obstacle(W+50, gapY, gapHeight);
  applyWallSkin(obs);
  obstacles.push(obs);
}

// ============ BUBBLE SPAWN ============
function spawnBubble(baseX){
  var targetObs = null, closestDist = Infinity;
  for(var i=0;i<obstacles.length;i++){
    var obs = obstacles[i];
    if(obs.x + obs.width < baseX - 60) continue;
    if(obs.x > baseX + 200) continue;
    var dist = Math.abs(obs.x - baseX);
    if(dist < closestDist){ closestDist = dist; targetObs = obs; }
  }
  if(!targetObs) return false;
  var isSuper = Math.random() < SUPER_BUBBLE_CHANCE;
  var r = isSuper ? SUPER_BUBBLE_RADIUS : BUBBLE_RADIUS;
  var safeTop = targetObs.gapY + r + BUBBLE_WALL_MARGIN;
  var safeBottom = targetObs.gapY + targetObs.gapHeight - r - BUBBLE_WALL_MARGIN;
  if(safeTop >= safeBottom) return false;
  var y = (safeTop + safeBottom) / 2;
  bubbles.push({x:baseX, y:y, r:r, isSuper:isSuper, bob:Math.random()*Math.PI*2, pulse:Math.random()*Math.PI*2, rotation:Math.random()*Math.PI*2});
  return true;
}

<script>
(function(){
'use strict';

var $ = function(id){ return document.getElementById(id); };
var canvas = $('game');
var ctx = canvas.getContext('2d');
var container = $('game-container');
var STATE = { MENU: 'menu', PLAYING: 'playing', PAUSED: 'paused', GAMEOVER: 'gameover' };
var state = STATE.MENU;
var W = 0, H = 0, DPR = 1;
var waterY = 0, waterVel = 0, holding = false, gameTime = 0;
var scrollSpeed = 260, score = 0, distance = 0;
var highscore = parseInt(localStorage.getItem('tidal_highscore') || '0', 10);
var screenShake = 0, flashAlpha = 0;
var boat = { x: 0, y: 0, angle: 0 };
var obstacles = [], bubbles = [], particles = [], floaters = [];
var obstacleSpawnTimer = 0, bubbleSpawnTimer = 0, tutorialTimer = 0;
var lastTime = performance.now();
var WATER_RISE_SPEED = 420, WATER_FALL_SPEED = 320;
var WATER_RISE_RESPONSIVENESS = 10, WATER_FALL_RESPONSIVENESS = 6;
var WATER_MAX_SPEED = 520;
var BOAT_W = 56, BOAT_H = 38;
var BUBBLE_RADIUS = 17, SUPER_BUBBLE_RADIUS = 26;
var SUPER_BUBBLE_CHANCE = 0.06, BUBBLE_WALL_MARGIN = 40;

// ============ SHOP STATE ============
var coins = parseInt(localStorage.getItem('tidal_coins') || '0', 10);
var ownedSkins = { boats: ['classic'], walls: ['crystal'] };
try {
  var savedOwned = JSON.parse(localStorage.getItem('tidal_owned') || 'null');
  if (savedOwned && savedOwned.boats && savedOwned.walls) {
    ownedSkins = savedOwned;
    if (ownedSkins.boats.indexOf('classic') < 0) ownedSkins.boats.push('classic');
    if (ownedSkins.walls.indexOf('crystal') < 0) ownedSkins.walls.push('crystal');
  }
} catch(e) {}
var selectedBoat = localStorage.getItem('tidal_boat') || 'classic';
var selectedWall = localStorage.getItem('tidal_wall') || 'crystal';
var currentShopTab = 'boats';
if (ownedSkins.boats.indexOf(selectedBoat) < 0) selectedBoat = 'classic';
if (ownedSkins.walls.indexOf(selectedWall) < 0) selectedWall = 'crystal';

function saveProgress(){
  try {
    localStorage.setItem('tidal_coins', String(coins));
    localStorage.setItem('tidal_owned', JSON.stringify(ownedSkins));
    localStorage.setItem('tidal_boat', selectedBoat);
    localStorage.setItem('tidal_wall', selectedWall);
  } catch(e) {}
}
function updateMenuCoins(){ $('menuCoins').textContent = coins; }

var shopItems = {
  boats: [
    {id:'classic', name:'Holzschiff', desc:'Klassisch', price:0, emoji:'🛶'},
    {id:'pirate', name:'Piratenschiff', desc:'Dunkel & gefährlich', price:100, emoji:'🏴‍☠️'},
    {id:'crystal', name:'Kristallboot', desc:'Leuchtet blau', price:250, emoji:'💎'},
    {id:'golden', name:'Goldboot', desc:'Reiner Luxus', price:500, emoji:'👑'}
  ],
  walls: [
    {id:'crystal', name:'Kristall-Türkis', desc:'Standard', price:0, emoji:'💠'},
    {id:'neon', name:'Neon Pink', desc:'Knallig pink', price:75, emoji:'💜'},
    {id:'lava', name:'Lava', desc:'Glühend heiß', price:150, emoji:'🔥'},
    {id:'ice', name:'Eisblau', desc:'Kalt & klar', price:300, emoji:'❄️'}
  ]
};

function applyWallSkin(obs){
  if (selectedWall === 'neon') obs.hue = 300 + Math.random() * 30;
  else if (selectedWall === 'lava') obs.hue = 5 + Math.random() * 25;
  else if (selectedWall === 'ice') obs.hue = 200 + Math.random() * 20;
}

// ============ BUTTONS (sofort registrieren!) ============

// ============ SHOP LOGIK ============
function openShop(){
  $('menu').classList.add('hidden');
  $('shop').classList.remove('hidden');
  currentShopTab = 'boats';
  var tabs = document.querySelectorAll('.shopTab');
  for(var i=0;i<tabs.length;i++){
    if(tabs[i].dataset.tab === 'boats') tabs[i].classList.add('active');
    else tabs[i].classList.remove('active');
  }
  renderShop();
}
function closeShop(){
  $('shop').classList.add('hidden');
  $('menu').classList.remove('hidden');
  updateMenuCoins();
}
function switchShopTab(tab){
  currentShopTab = tab;
  var tabs = document.querySelectorAll('.shopTab');
  for(var i=0;i<tabs.length;i++){
    if(tabs[i].dataset.tab === tab) tabs[i].classList.add('active');
    else tabs[i].classList.remove('active');
  }
  renderShop();
}
function renderShop(){
  $('shopCoins').textContent = coins;
  var t = translations[currentLang];
  var items = shopItems[currentShopTab];
  var html = '';
  for(var i=0;i<items.length;i++){
    var item = items[i];
    var owned = ownedSkins[currentShopTab].indexOf(item.id) >= 0;
    var sel = (currentShopTab === 'boats' ? selectedBoat : selectedWall) === item.id;
    var label, cls, action, dis = '';
    if(sel){ label = t.shopSelected; cls = 'shop-btn selected'; action = 'none'; }
    else if(owned){ label = t.shopSelect; cls = 'shop-btn owned'; action = 'select'; }
    else { label = item.price + ' 💰'; cls = 'shop-btn buy'; action = 'buy'; if(coins < item.price) dis = ' disabled'; }
    html += '<div class="shop-item'+(sel?' active':'')+'">' +
      '<div class="shop-preview '+currentShopTab+'-'+item.id+'">'+item.emoji+'</div>' +
      '<div class="shop-item-name">'+item.name+'</div>' +
      '<div class="shop-item-desc">'+item.desc+'</div>' +
      '<button class="'+cls+'" data-action="'+action+'" data-tab="'+currentShopTab+'" data-id="'+item.id+'"'+dis+'>'+label+'</button>' +
      '</div>';
  }
  $('shopContent').innerHTML = html;
  var btns = $('shopContent').querySelectorAll('button');
  for(var j=0;j<btns.length;j++) btns[j].addEventListener('click', handleShopAction);
}
function handleShopAction(){
  var action = this.dataset.action;
  var tab = this.dataset.tab;
  var id = this.dataset.id;
  if(action === 'none') return;
  if(action === 'select'){
    if(tab === 'boats') selectedBoat = id;
    else selectedWall = id;
    saveProgress();
    renderShop();
  } else if(action === 'buy'){
    var item = null;
    for(var i=0;i<shopItems[tab].length;i++){
      if(shopItems[tab][i].id === id){ item = shopItems[tab][i]; break; }
    }
    if(!item || coins < item.price) return;
    coins -= item.price;
    ownedSkins[tab].push(id);
    if(tab === 'boats') selectedBoat = id;
    else selectedWall = id;
    saveProgress();
    updateMenuCoins();
    renderShop();
  }
}

function resize(){
  var rect = container.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width; H = rect.height;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 100); });
resize();

// ============ PARTIKEL ============
function spawnParticle(x,y,vx,vy,o){
  o = o || {};
  if(particles.length > 340) return;
  particles.push({x:x,y:y,vx:vx,vy:vy,life:o.life||1,maxLife:o.life||1,size:o.size||3,color:o.color||'rgba(168,240,255,0.8)',gravity:o.gravity||0});
}
function spawnDirectionalSplash(x, y, intensity, rising){
  var count = Math.max(1, Math.floor(intensity*9));
  for(var i=0;i<count;i++){
    if(rising){
      var a1 = -Math.PI/2 + (Math.random()-0.5)*Math.PI*0.9;
      var s1 = 90 + Math.random()*220*intensity;
      spawnParticle(x+(Math.random()-0.5)*BOAT_W*0.9, y+2+Math.random()*4, Math.cos(a1)*s1, Math.sin(a1)*s1,
        {life:0.5+Math.random()*0.35,size:1.5+Math.random()*2.2,color:'rgba(210,245,255,'+(0.7+Math.random()*0.3)+')',gravity:420});
    } else {
      var side = Math.random()<0.5?-1:1;
      var a2 = (side>0?0:Math.PI) + (Math.random()-0.5)*Math.PI*0.55;
      var s2 = 70 + Math.random()*170*intensity;
      spawnParticle(x+side*BOAT_W*0.42, y+3+Math.random()*5, Math.cos(a2)*s2, Math.sin(a2)*s2-30,
        {life:0.45+Math.random()*0.35,size:1.4+Math.random()*2.5,color:'rgba(190,235,255,'+(0.6+Math.random()*0.35)+')',gravity:340});
    }
  }
}
function spawnExplosion(x,y){
  for(var i=0;i<36;i++){
    var a = Math.random()*Math.PI*2, s = 100+Math.random()*380;
    spawnParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,
      {life:0.7+Math.random()*0.7,size:3+Math.random()*4,color:'rgba(255,'+((120+Math.random()*100)|0)+','+((100+Math.random()*100)|0)+',1)',gravity:220});
  }
}

// ============ HINDERNISSE ============
function Obstacle(x, gapY, gapHeight){
  this.x = x; this.gapY = gapY; this.gapHeight = gapHeight;
  this.width = Math.max(64, W*0.11);
  this.passed = false;
  this.hue = 175 + Math.random()*45;
  this.glowPulse = Math.random()*Math.PI*2;
}
function spawnObstacle(){
  var gapHeightFactor = Math.max(0.22, 0.38 - distance*0.0015);
  var gapHeight = H*gapHeightFactor;
  var minY = H*0.12, maxY = H*0.85 - gapHeight;
  var gapY = minY + Math.random()*Math.max(0, maxY-minY);
  var obs = new Obstacle(W+50, gapY, gapHeight);
  applyWallSkin(obs);
  obstacles.push(obs);
}

// ============ BUBBLE SPAWN ============
function spawnBubble(baseX){
  var targetObs = null, closestDist = Infinity;
  for(var i=0;i<obstacles.length;i++){
    var obs = obstacles[i];
    if(obs.x + obs.width < baseX - 60) continue;
    if(obs.x > baseX + 200) continue;
    var dist = Math.abs(obs.x - baseX);
    if(dist < closestDist){ closestDist = dist; targetObs = obs; }
  }
  if(!targetObs) return false;
  var isSuper = Math.random() < SUPER_BUBBLE_CHANCE;
  var r = isSuper ? SUPER_BUBBLE_RADIUS : BUBBLE_RADIUS;
  var safeTop = targetObs.gapY + r + BUBBLE_WALL_MARGIN;
  var safeBottom = targetObs.gapY + targetObs.gapHeight - r - BUBBLE_WALL_MARGIN;
  if(safeTop >= safeBottom) return false;
  var y = (safeTop + safeBottom) / 2;
  bubbles.push({x:baseX, y:y, r:r, isSuper:isSuper, bob:Math.random()*Math.PI*2, pulse:Math.random()*Math.PI*2, rotation:Math.random()*Math.PI*2});
  return true;
}

var ADMIN_CODE = 'TIDAL2024';
var adminTrigger = $('adminTrigger');
var adminLogin = $('adminLogin');
var adminPanel = $('adminPanel');

var adminError = $('adminError');
var adminCoinsEl = $('adminCoins');

function updateAdminCoins(){ if(adminCoinsEl) adminCoinsEl.textContent = coins; }

adminTrigger.addEventListener('click', function(){
  adminLogin.classList.remove('hidden');
  adminCodeInput.value = '';
  adminError.textContent = '';
  setTimeout(function(){ adminCodeInput.focus(); }, 150);
});
$('adminCancelBtn').addEventListener('click', function(){
  adminLogin.classList.add('hidden');
});

function tryAdminLogin(){
  var code = (adminCodeInput.value || '').trim().toUpperCase();
  if(code === ADMIN_CODE){
    adminLogin.classList.add('hidden');
    adminPanel.classList.remove('hidden');
    updateAdminCoins();
  } else {
    adminError.textContent = '❌ Falscher Code';
    adminCodeInput.value = '';
    adminCodeInput.focus();
  }
}
$('adminLoginBtn').addEventListener('click', tryAdminLogin);
adminCodeInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); tryAdminLogin(); }
});

$('adminCloseBtn').addEventListener('click', function(){
  adminPanel.classList.add('hidden');
  updateMenuCoins();
});

var adminActionBtns = document.querySelectorAll('[data-admin]');
for(var ai = 0; ai < adminActionBtns.length; ai++){
  adminActionBtns[ai].addEventListener('click', handleAdminAction);
}

function handleAdminAction(){
  var action = this.dataset.admin;
  if(action === 'coins1000'){ coins += 1000; saveProgress(); updateMenuCoins(); updateAdminCoins(); }
  else if(action === 'coins9999'){ coins += 9999; saveProgress(); updateMenuCoins(); updateAdminCoins(); }
  else if(action === 'allSkins'){
    ownedSkins.boats = ['classic','pirate','crystal','golden'];
    ownedSkins.walls = ['crystal','neon','lava','ice'];
    saveProgress();
    if(typeof renderShop === 'function' && currentShopTab) renderShop();
    updateMenuCoins();
  }
  else if(action === 'unlockBoats'){
    ownedSkins.boats = ['classic','pirate','crystal','golden'];
    saveProgress();
    if(typeof renderShop === 'function' && currentShopTab) renderShop();
  }
  else if(action === 'unlockWalls'){
    ownedSkins.walls = ['crystal','neon','lava','ice'];
    saveProgress();
    if(typeof renderShop === 'function' && currentShopTab) renderShop();
  }
  else if(action === 'highscore9999'){
    highscore = 9999;
    try{ localStorage.setItem('tidal_highscore', '9999'); }catch(e){}
    $('menuHighscore').textContent = '9999';
  }
  else if(action === 'clearCoins'){
    if(confirm('Münzen wirklich auf 0 setzen?')){
      coins = 0; saveProgress(); updateMenuCoins(); updateAdminCoins();
    }
  }
  else if(action === 'resetAll'){
    if(confirm('WIRKLICH ALLES zurücksetzen? (Coins, Skins, Highscore)')){
      coins = 0;
      ownedSkins = { boats: ['classic'], walls: ['crystal'] };
      selectedBoat = 'classic';
      selectedWall = 'crystal';
      highscore = 0;
      try{
        localStorage.setItem('tidal_coins', '0');
        localStorage.setItem('tidal_owned', JSON.stringify(ownedSkins));
        localStorage.setItem('tidal_boat', 'classic');
        localStorage.setItem('tidal_wall', 'crystal');
        localStorage.setItem('tidal_highscore', '0');
      }catch(e){}
      $('menuHighscore').textContent = '0';
      updateMenuCoins();
      updateAdminCoins();
      if(typeof renderShop === 'function' && currentShopTab) renderShop();
    }
  }
}
