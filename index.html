<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1128">
<title>TIDAL</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  #game-container {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, rgba(10, 30, 60, 0.85), rgba(5, 10, 25, 0.95));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 10;
    padding: 24px;
    transition: opacity 0.4s ease;
  }
  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  h1.title {
    font-size: clamp(56px, 16vw, 130px);
    font-weight: 900;
    letter-spacing: 0.15em;
    background: linear-gradient(180deg, #d0faff 0%, #4dc8ff 40%, #1a6fd8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(77, 200, 255, 0.7));
    margin-bottom: 6px;
    animation: titlePulse 3s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { filter: drop-shadow(0 0 30px rgba(77, 200, 255, 0.7)); }
    50% { filter: drop-shadow(0 0 60px rgba(77, 200, 255, 1)); }
  }

  h2 {
    font-size: clamp(32px, 9vw, 60px);
    font-weight: 900;
    letter-spacing: 0.1em;
    color: #ff6b6b;
    text-shadow: 0 0 30px rgba(255, 107, 107, 0.8);
    margin-bottom: 24px;
    text-align: center;
  }

  .subtitle {
    font-size: clamp(13px, 3.6vw, 17px);
    color: #8ab4d8;
    margin-bottom: 40px;
    letter-spacing: 0.15em;
    text-align: center;
    line-height: 1.6;
  }

  button {
    font-family: inherit;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 700;
    letter-spacing: 0.2em;
    padding: 16px 48px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #4dc8ff 0%, #1a8cd8 100%);
    color: #001a2e;
    cursor: pointer;
    box-shadow: 0 6px 30px rgba(77, 200, 255, 0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    margin: 8px;
    min-width: 180px;
  }
  button:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 50px rgba(77, 200, 255, 0.9), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  button:active {
    transform: scale(0.97);
  }
  button.secondary {
    background: rgba(255, 255, 255, 0.08);
    color: #cfe8ff;
    box-shadow: 0 4px 20px rgba(255, 255, 255, 0.08), inset 0 1px 0 rgba(255,255,255,0.1);
    border: 1px solid rgba(168, 240, 255, 0.25);
  }

  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
  }
  #hud.hidden { display: none; }
  #score {
    font-size: clamp(32px, 8vw, 46px);
    font-weight: 900;
    color: #d0faff;
    text-shadow: 0 0 24px rgba(77, 200, 255, 0.9), 0 0 8px rgba(77, 200, 255, 0.6);
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
  }
  #pauseBtn {
    pointer-events: auto;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    padding: 0;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: unset;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(168, 240, 255, 0.3);
    color: #fff;
    box-shadow: 0 0 15px rgba(77, 200, 255, 0.3);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .score-display {
    background: linear-gradient(180deg, rgba(77, 200, 255, 0.1), rgba(26, 140, 216, 0.05));
    border: 1px solid rgba(77, 200, 255, 0.35);
    border-radius: 20px;
    padding: 28px 48px;
    margin-bottom: 24px;
    text-align: center;
    box-shadow: 0 0 40px rgba(77, 200, 255, 0.15), inset 0 0 30px rgba(77, 200, 255, 0.05);
  }
  .score-label {
    font-size: 13px;
    color: #8ab4d8;
    letter-spacing: 0.4em;
    margin-bottom: 6px;
  }
  .score-value {
    font-size: clamp(48px, 14vw, 72px);
    font-weight: 900;
    color: #d0faff;
    text-shadow: 0 0 30px rgba(77, 200, 255, 0.9);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .highscore-label {
    margin-top: 20px;
    font-size: 13px;
    color: #ffd700;
    letter-spacing: 0.2em;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
  }
  .highscore-value {
    color: #ffd700;
    font-weight: 800;
  }

  .instructions {
    margin-top: 32px;
    font-size: 14px;
    color: #8ab4d8;
    text-align: center;
    line-height: 1.9;
    max-width: 420px;
    padding: 20px;
    border-top: 1px solid rgba(77, 200, 255, 0.15);
  }
  .instructions strong {
    color: #4dc8ff;
    font-weight: 700;
  }
  .instructions .gesture {
    display: inline-block;
    padding: 2px 10px;
    background: rgba(77, 200, 255, 0.15);
    border: 1px solid rgba(77, 200, 255, 0.4);
    border-radius: 6px;
    font-size: 12px;
    color: #a8f0ff;
    margin: 0 2px;
  }

  .menu-highscore {
    margin-top: 24px;
    font-size: 14px;
    color: #ffd700;
    letter-spacing: 0.15em;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
  }

  #tutorialHint {
    position: absolute;
    left: 50%;
    bottom: 25%;
    transform: translateX(-50%);
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 700;
    color: #d0faff;
    letter-spacing: 0.15em;
    text-shadow: 0 0 20px rgba(77, 200, 255, 0.9);
    pointer-events: none;
    z-index: 6;
    opacity: 0;
    transition: opacity 0.6s ease;
    text-align: center;
    white-space: nowrap;
  }
  #tutorialHint.visible {
    opacity: 1;
    animation: hintPulse 1.4s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.08); }
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="score">0</div>
    <button id="pauseBtn" aria-label="Pause">⏸</button>
  </div>

  <div id="tutorialHint"></div>

  <div id="menu" class="overlay">
    <h1 class="title">TIDAL</h1>
    <p class="subtitle">STEUERE DAS WASSER.<br>NICHT DAS BOOT.</p>
    <button id="playBtn">▶ SPIELEN</button>
    <div class="menu-highscore">
      HIGHSCORE: <span id="menuHighscore">0</span>
    </div>
    <div class="instructions">
      <span class="gesture">GEDRÜCKT HALTEN</span> → Wasser steigt<br>
      <span class="gesture">LOSLASSEN</span> → Wasser sinkt<br><br>
      Manövriere dein Boot durch die Lücken.<br>
      Sammle goldene Bubbles für Bonuspunkte!
    </div>
  </div>

  <div id="gameover" class="overlay hidden">
    <h2>GAME OVER</h2>
    <div class="score-display">
      <div class="score-label">PUNKTE</div>
      <div class="score-value" id="finalScore">0</div>
      <div class="highscore-label">HIGHSCORE: <span class="highscore-value" id="finalHighscore">0</span></div>
    </div>
    <button id="retryBtn">NOCHMAL</button>
    <button id="menuBtn" class="secondary">MENÜ</button>
  </div>

  <div id="pause" class="overlay hidden">
    <h2 style="color:#d0faff; text-shadow: 0 0 30px rgba(77, 200, 255, 0.7);">PAUSE</h2>
    <button id="resumeBtn">WEITER</button>
    <button id="quitBtn" class="secondary">MENÜ</button>
  </div>
</div>

<script>
// =============================================================
//  TIDAL — Version 1.1
//  Bugfix: Bubbles in Wänden | Größere Bubbles |
//  Flüssigere Steuerung | Realistisches Wasser
// =============================================================

(function () {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('game-container');

  const menuEl = document.getElementById('menu');
  const gameoverEl = document.getElementById('gameover');
  const pauseEl = document.getElementById('pause');
  const hudEl = document.getElementById('hud');
  const scoreEl = document.getElementById('score');
  const finalScoreEl = document.getElementById('finalScore');
  const finalHighscoreEl = document.getElementById('finalHighscore');
  const menuHighscoreEl = document.getElementById('menuHighscore');
  const tutorialHintEl = document.getElementById('tutorialHint');

  const playBtn = document.getElementById('playBtn');
  const retryBtn = document.getElementById('retryBtn');
  const menuBtn = document.getElementById('menuBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resumeBtn = document.getElementById('resumeBtn');
  const quitBtn = document.getElementById('quitBtn');

  let W = 0, H = 0, DPR = 1;

  function resize() {
    const rect = container.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 100); });
  resize();

  const STATE = { MENU: 'menu', PLAYING: 'playing', PAUSED: 'paused', GAMEOVER: 'gameover' };
  let state = STATE.MENU;

  let waterY = 0;
  let waterVel = 0;
  let holding = false;
  let gameTime = 0;
  let scrollSpeed = 260;
  let score = 0;
  let distance = 0;
  let highscore = parseInt(localStorage.getItem('tidal_highscore') || '0', 10);
  let screenShake = 0;
  let flashAlpha = 0;

  const boat = { x: 0, y: 0, angle: 0 };

  let obstacles = [];
  let bubbles = [];
  let particles = [];
  let floaters = [];

  let obstacleSpawnTimer = 0;
  let bubbleSpawnTimer = 0;
  let tutorialTimer = 0;

  // ----- Physik-Parameter (v1.1: weicher, smoother) -----
  const WATER_RISE_SPEED = 420;
  const WATER_FALL_SPEED = 320;
  const WATER_RISE_RESPONSIVENESS = 10;
  const WATER_FALL_RESPONSIVENESS = 6;
  const WATER_MAX_SPEED = 520;
  const BOAT_W = 56;
  const BOAT_H = 38;
  const BOAT_FOLLOW_RATE = 18;
  const BOAT_ANGLE_RATE = 11;
  const BUBBLE_RADIUS = 17;

  menuHighscoreEl.textContent = highscore;

  function spawnParticle(x, y, vx, vy, opts) {
    opts = opts || {};
    if (particles.length > 260) return;
    particles.push({
      x: x, y: y, vx: vx, vy: vy,
      life: opts.life || 1,
      maxLife: opts.life || 1,
      size: opts.size || 3,
      color: opts.color || 'rgba(168,240,255,0.8)',
      gravity: opts.gravity || 0
    });
  }

  function spawnSplash(x, y, intensity) {
    const count = Math.floor(intensity * 6);
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.9;
      const speed = 60 + Math.random() * 180 * intensity;
      spawnParticle(
        x + (Math.random() - 0.5) * BOAT_W,
        y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        {
          life: 0.55 + Math.random() * 0.4,
          size: 1.5 + Math.random() * 2.5,
          color: 'rgba(180,230,255,' + (0.5 + Math.random() * 0.4) + ')',
          gravity: 380
        }
      );
    }
  }

  function spawnExplosion(x, y) {
    for (let i = 0; i < 36; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 100 + Math.random() * 380;
      spawnParticle(
        x, y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        {
          life: 0.7 + Math.random() * 0.7,
          size: 3 + Math.random() * 4,
          color: 'rgba(255,' + (120 + Math.random() * 100 | 0) + ',' + (100 + Math.random() * 100 | 0) + ',1)',
          gravity: 220
        }
      );
    }
  }

  function Obstacle(x, gapY, gapHeight) {
    this.x = x;
    this.gapY = gapY;
    this.gapHeight = gapHeight;
    this.width = Math.max(64, W * 0.11);
    this.passed = false;
    this.hue = 175 + Math.random() * 45;
    this.glowPulse = Math.random() * Math.PI * 2;
  }

  function spawnObstacle() {
    const gapHeightFactor = Math.max(0.22, 0.38 - distance * 0.0015);
    const gapHeight = H * gapHeightFactor;
    const minY = H * 0.12;
    const maxY = H * 0.85 - gapHeight;
    const gapY = minY + Math.random() * Math.max(0, maxY - minY);
    obstacles.push(new Obstacle(W + 50, gapY, gapHeight));
  }

  // ============================================================
  //  v1.1 BUGFIX: Bubble-Spawn prüft Hindernisse
  // ============================================================
  function spawnBubble(baseX, baseY) {
    const r = BUBBLE_RADIUS;
    const margin = r + 5;
    let x = baseX;
    let y = baseY;

    // Prüfe jedes Hindernis: würde die Bubble in einer Säule landen?
    for (let i = 0; i < obstacles.length; i++) {
      const obs = obstacles[i];
      const overlapsX = (x + margin > obs.x) && (x - margin < obs.x + obs.width);
      if (!overlapsX) continue;

      // Bubble liegt X-mäßig im Hindernis → Y in die Lücke zwingen
      const gapTop = obs.gapY + margin;
      const gapBottom = obs.gapY + obs.gapHeight - margin;

      // Kein Platz für die Bubble in der Lücke → diesen Spawn auslassen
      if (gapTop > gapBottom) return;

      if (y < gapTop) y = gapTop;
      if (y > gapBottom) y = gapBottom;
    }

    // Zusätzlich gegen oberen/unteren Bildschirmrand absichern
    const minY = margin + 4;
    const maxY = H - margin - 4;
    if (y < minY) y = minY;
    if (y > maxY) y = maxY;

    bubbles.push({
      x: x, y: y, r: r,
      bob: Math.random() * Math.PI * 2,
      pulse: Math.random() * Math.PI * 2
    });
  }

  function pointerDown(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (state === STATE.PLAYING) {
      if (!holding) spawnSplash(boat.x, waterY, 0.5);
      holding = true;
    }
  }
  function pointerUp(e) {
    if (e && e.preventDefault) e.preventDefault();
    holding = false;
  }

  canvas.addEventListener('pointerdown', pointerDown, { passive: false });
  window.addEventListener('pointerup', pointerUp, { passive: false });
  window.addEventListener('pointercancel', pointerUp, { passive: false });
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      if (state === STATE.PLAYING) holding = true;
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      holding = false;
      e.preventDefault();
    }
  });

  // =========================================================
  //  GAME FLOW
  // =========================================================
  function startGame() {
    state = STATE.PLAYING;
    gameTime = 0;
    score = 0;
    distance = 0;
    waterY = H * 0.5;
    waterVel = 0;
    holding = false;
    scrollSpeed = 260;
    obstacles = [];
    bubbles = [];
    particles = [];
    floaters = [];
    obstacleSpawnTimer = 1.3;
    bubbleSpawnTimer = 1.2;
    screenShake = 0;
    flashAlpha = 0;
    tutorialTimer = 2.6;

    boat.x = Math.max(W * 0.22, 80);
    boat.y = waterY - BOAT_H * 0.4;
    boat.angle = 0;

    scoreEl.textContent = '0';
    tutorialHintEl.textContent = 'GEDRÜCKT HALTEN';
    tutorialHintEl.classList.add('visible');

    menuEl.classList.add('hidden');
    gameoverEl.classList.add('hidden');
    pauseEl.classList.add('hidden');
    hudEl.classList.remove('hidden');

    lastTime = performance.now();
  }

  function goToMenu() {
    state = STATE.MENU;
    menuHighscoreEl.textContent = highscore;
    menuEl.classList.remove('hidden');
    gameoverEl.classList.add('hidden');
    pauseEl.classList.add('hidden');
    hudEl.classList.add('hidden');
    tutorialHintEl.classList.remove('visible');
    resetIdleScene();
  }

  function pauseGame() {
    if (state === STATE.PLAYING) {
      state = STATE.PAUSED;
      pauseEl.classList.remove('hidden');
      holding = false;
    }
  }

  function resumeGame() {
    if (state === STATE.PAUSED) {
      state = STATE.PLAYING;
      pauseEl.classList.add('hidden');
      lastTime = performance.now();
    }
  }

  function gameOver() {
    state = STATE.GAMEOVER;
    screenShake = 22;
    flashAlpha = 0.55;
    spawnExplosion(boat.x, boat.y);
    holding = false;
    tutorialHintEl.classList.remove('visible');

    if (score > highscore) {
      highscore = score;
      try { localStorage.setItem('tidal_highscore', String(highscore)); } catch (e) {}
    }
    finalScoreEl.textContent = score;
    finalHighscoreEl.textContent = highscore;
    hudEl.classList.add('hidden');

    setTimeout(function () {
      if (state === STATE.GAMEOVER) gameoverEl.classList.remove('hidden');
    }, 750);
  }

  function resetIdleScene() {
    waterY = H * 0.62;
    waterVel = 0;
    boat.x = Math.max(W * 0.22, 80);
    boat.y = waterY - BOAT_H * 0.4;
    boat.angle = 0;
    particles = [];
    obstacles = [];
    bubbles = [];
    floaters = [];
  }

  // =========================================================
  //  UPDATE  (v1.1: neue Physik)
  // =========================================================
  function update(dt) {
    if (dt > 0.05) dt = 0.05;

    if (state === STATE.PLAYING) {
      gameTime += dt;

      if (tutorialTimer > 0) {
        tutorialTimer -= dt;
        if (tutorialTimer <= 0) tutorialHintEl.classList.remove('visible');
      }

      scrollSpeed = 260 + Math.min(distance * 0.55, 280);

      // ---- v1.1: Velocity-Target-Physik (flüssiger) ----
      const targetVel = holding ? -WATER_RISE_SPEED : WATER_FALL_SPEED;
      const responsiveness = holding ? WATER_RISE_RESPONSIVENESS : WATER_FALL_RESPONSIVENESS;
      const lerpF = 1 - Math.exp(-responsiveness * dt);
      waterVel += (targetVel - waterVel) * lerpF;

      if (waterVel > WATER_MAX_SPEED) waterVel = WATER_MAX_SPEED;
      if (waterVel < -WATER_MAX_SPEED) waterVel = -WATER_MAX_SPEED;
      waterY += waterVel * dt;

      // ---- Weicher Rand-Bounce statt hartem Clamp ----
      const minY = H * 0.08;
      const maxY = H * 0.92;
      if (waterY < minY) {
        waterY = minY;
        if (waterVel < 0) waterVel *= -0.35;
      }
      if (waterY > maxY) {
        waterY = maxY;
        if (waterVel > 0) waterVel *= -0.35;
      }

      if (Math.abs(waterVel) > 180 && Math.random() < 0.5) {
        spawnSplash(boat.x, waterY, Math.min(1, Math.abs(waterVel) / WATER_MAX_SPEED));
      }

      // ---- v1.1: Boot folgt Wasser per exp. Glättung ----
      const bob = Math.sin(gameTime * 3.2) * 2.5 + Math.sin(gameTime * 5.7) * 1.1;
      const targetY = waterY - BOAT_H * 0.4 + bob;
      boat.y += (targetY - boat.y) * (1 - Math.exp(-BOAT_FOLLOW_RATE * dt));

      let targetAngle = waterVel * 0.0011;
      if (targetAngle > 0.42) targetAngle = 0.42;
      if (targetAngle < -0.42) targetAngle = -0.42;
      boat.angle += (targetAngle - boat.angle) * (1 - Math.exp(-BOAT_ANGLE_RATE * dt));

      distance += scrollSpeed * dt * 0.01;

      obstacleSpawnTimer -= dt;
      if (obstacleSpawnTimer <= 0) {
        spawnObstacle();
        const baseInterval = Math.max(1.05, 2.0 - distance * 0.004);
        obstacleSpawnTimer = baseInterval + Math.random() * 0.35;
      }

      bubbleSpawnTimer -= dt;
      if (bubbleSpawnTimer <= 0) {
        // v1.1: Bubble weiter links spawnen, damit sie nicht mit frisch
        // gespawnten Hindernissen (bei W+50) kollidiert
        const spawnY = H * 0.12 + Math.random() * H * 0.76;
        spawnBubble(W + 26, spawnY);
        bubbleSpawnTimer = 1.6 + Math.random() * 2.2;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= scrollSpeed * dt;
        obs.glowPulse += dt * 3;
        if (!obs.passed && obs.x + obs.width < boat.x - BOAT_W * 0.5) {
          obs.passed = true;
          score += 1;
          scoreEl.textContent = score;
        }
        if (obs.x + obs.width < -60) obstacles.splice(i, 1);
      }

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.x -= scrollSpeed * dt;
        b.bob += dt * 2;
        b.pulse += dt * 4;

        const dx = b.x - boat.x;
        const dy = (b.y + Math.sin(b.bob) * 5) - boat.y;
        const hitR = BOAT_W * 0.5 + b.r;
        if (dx * dx + dy * dy < hitR * hitR) {
          score += 5;
          scoreEl.textContent = score;
          for (let k = 0; k < 14; k++) {
            const a = Math.random() * Math.PI * 2;
            spawnParticle(b.x, b.y, Math.cos(a) * 220, Math.sin(a) * 220, {
              life: 0.55, size: 3.5, color: 'rgba(255,215,0,0.95)', gravity: 0
            });
          }
          floaters.push({ x: b.x, y: b.y, text: '+5', life: 1, maxLife: 1, vy: -80 });
          bubbles.splice(i, 1);
          continue;
        }
        if (b.x < -60) bubbles.splice(i, 1);
      }

      const bt = boat.y - BOAT_H * 0.4;
      const bb = boat.y + BOAT_H * 0.4;
      const bl = boat.x - BOAT_W * 0.4;
      const br = boat.x + BOAT_W * 0.4;

      for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        if (br > obs.x + 4 && bl < obs.x + obs.width - 4) {
          if (bt < obs.gapY || bb > obs.gapY + obs.gapHeight) {
            gameOver();
            break;
          }
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt;
      f.y += f.vy * dt;
      f.vy *= 0.95;
      if (f.life <= 0) floaters.splice(i, 1);
    }

    if (screenShake > 0) screenShake *= Math.exp(-8 * dt);
    if (screenShake < 0.5) screenShake = 0;
    if (flashAlpha > 0) flashAlpha -= dt * 1.5;
    if (flashAlpha < 0) flashAlpha = 0;

    if (state === STATE.MENU || state === STATE.GAMEOVER) {
      gameTime += dt;
      waterY = H * 0.62;
      boat.y = waterY - BOAT_H * 0.4 + Math.sin(gameTime * 1.5) * 4;
      boat.angle = Math.sin(gameTime * 1.2) * 0.05;
    }
  }

  // =========================================================
  //  RENDER
  // =========================================================
  const ambientBubbles = [];
  for (let i = 0; i < 32; i++) {
    ambientBubbles.push({
      x: Math.random(),
      y: Math.random(),
      r: 1 + Math.random() * 3.5,
      speed: 0.006 + Math.random() * 0.02,
      drift: Math.random() * Math.PI * 2,
      depth: Math.random()
    });
  }

  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a1128');
    grad.addColorStop(0.4, '#0d1f3f');
    grad.addColorStop(0.7, '#122f5a');
    grad.addColorStop(1, '#081428');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < 50; i++) {
      const sx = (i * 137.5 + gameTime * 4) % W;
      const sy = (i * 73.3) % (H * 0.72);
      const alpha = 0.15 + Math.abs(Math.sin(gameTime * 1.5 + i)) * 0.25;
      ctx.fillStyle = 'rgba(200,230,255,' + alpha + ')';
      ctx.beginPath();
      ctx.arc(sx, sy, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }

    for (let i = 0; i < ambientBubbles.length; i++) {
      const b = ambientBubbles[i];
      b.y -= b.speed * 0.016;
      b.drift += 0.015;
      if (b.y < -0.1) { b.y = 1.1; b.x = Math.random(); }
      const px = (b.x + Math.sin(b.drift) * 0.02) * W;
      const py = b.y * H;
      const alpha = 0.08 + b.depth * 0.2;
      ctx.fillStyle = 'rgba(168,240,255,' + alpha + ')';
      ctx.beginPath();
      ctx.arc(px, py, b.r * (0.5 + b.depth), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ============================================================
  //  v1.1: REALISTISCHES WASSER mit Animation
  // ============================================================
  function drawWater() {
    const wy = waterY;
    const t = gameTime;

    // ---- Wellen-Pfad mit 4 überlagerten Frequenzen berechnen ----
    const wavePts = [];
    const step = 4;
    for (let x = 0; x <= W + step; x += step) {
      let y = wy;
      y += Math.sin(x * 0.011 + t * 2.2) * 6;
      y += Math.sin(x * 0.022 - t * 3.1) * 3.2;
      y += Math.sin(x * 0.005 + t * 1.4) * 4.5;
      y += Math.sin(x * 0.04 + t * 4.5) * 1.6;
      wavePts.push({ x: x, y: y });
    }

    function buildPath() {
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(wavePts[0].x, wavePts[0].y);
      for (let i = 1; i < wavePts.length; i++) {
        ctx.lineTo(wavePts[i].x, wavePts[i].y);
      }
      ctx.lineTo(wavePts[wavePts.length - 1].x, H);
      ctx.closePath();
    }

    // ---- Wasser-Körper mit Tiefen-Gradient ----
    const grad = ctx.createLinearGradient(0, wy - 30, 0, H);
    grad.addColorStop(0, 'rgba(80,190,245,0.62)');
    grad.addColorStop(0.12, 'rgba(45,150,225,0.80)');
    grad.addColorStop(0.35, 'rgba(20,95,185,0.90)');
    grad.addColorStop(0.7, 'rgba(8,50,130,0.95)');
    grad.addColorStop(1, 'rgba(2,15,50,0.98)');
    buildPath();
    ctx.fillStyle = grad;
    ctx.fill();

    // ---- Unterwasser-Effekte (geclippt) ----
    ctx.save();
    buildPath();
    ctx.clip();
    ctx.globalCompositeOperation = 'lighter';

    // Lichtstrahlen von der Oberfläche
    for (let i = 0; i < 5; i++) {
      const bx = ((i / 5) * W + Math.sin(t * 0.4 + i * 1.3) * 50 + W) % W;
      const rayW = 25 + Math.sin(t + i) * 10;
      ctx.fillStyle = 'rgba(150,220,255,0.06)';
      ctx.beginPath();
      ctx.moveTo(bx - rayW * 0.3, wy);
      ctx.lineTo(bx + rayW * 0.3, wy);
      ctx.lineTo(bx + rayW, H);
      ctx.lineTo(bx, H);
      ctx.closePath();
      ctx.fill();
    }

    // Kaustik-Blobs (bewegte Lichtflecken)
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 173 + t * 40) % (W + 200)) - 100;
      const baseY = wy + 50 + (i % 3) * 60;
      const cy = baseY + Math.sin(t * 1.5 + i) * 25;
      const r = 55 + Math.sin(t * 0.8 + i * 2) * 15;
      const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      cg.addColorStop(0, 'rgba(180,230,255,0.10)');
      cg.addColorStop(0.6, 'rgba(140,210,255,0.04)');
      cg.addColorStop(1, 'rgba(180,230,255,0)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Tiefen-Glow unten
    const deepGlow = ctx.createRadialGradient(W * 0.5, H, 0, W * 0.5, H, H * 0.8);
    deepGlow.addColorStop(0, 'rgba(0,60,180,0.28)');
    deepGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = deepGlow;
    ctx.fillRect(0, wy, W, H - wy);

    ctx.restore();

    // ---- Oberflächen-Highlight (Glow + helle Linie) ----
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    ctx.beginPath();
    for (let i = 0; i < wavePts.length; i++) {
      if (i === 0) ctx.moveTo(wavePts[i].x, wavePts[i].y - 3);
      else ctx.lineTo(wavePts[i].x, wavePts[i].y - 3);
    }
    ctx.strokeStyle = 'rgba(150,220,255,0.30)';
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    for (let i = 0; i < wavePts.length; i++) {
      if (i === 0) ctx.moveTo(wavePts[i].x, wavePts[i].y - 1);
      else ctx.lineTo(wavePts[i].x, wavePts[i].y - 1);
    }
    ctx.strokeStyle = 'rgba(220,245,255,0.85)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.restore();

    // ---- Oberflächen-Glitzer ----
    for (let i = 0; i < 18; i++) {
      const sx = ((i * 89 + t * 55) % W);
      const idx = Math.floor(sx / step);
      if (idx >= 0 && idx < wavePts.length) {
        const sy = wavePts[idx].y;
        const twinkle = Math.abs(Math.sin(t * 3.5 + i * 1.7));
        if (twinkle > 0.55) {
          const alpha = Math.min(1, (twinkle - 0.55) * 1.8);
          ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
          ctx.beginPath();
          ctx.arc(sx, sy - 1, 1.5 + Math.sin(t * 5 + i) * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  function drawPillar(x, y, w, h, hue, pulse, isTop) {
    if (h <= 0) return;

    ctx.fillStyle = 'hsla(' + hue + ',100%,60%,' + (0.10 * pulse) + ')';
    ctx.fillRect(x - 6, y, w + 12, h);

    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, 'hsla(' + hue + ',70%,22%,0.95)');
    grad.addColorStop(0.3, 'hsla(' + hue + ',80%,38%,0.98)');
    grad.addColorStop(0.5, 'hsla(' + hue + ',90%,50%,1)');
    grad.addColorStop(0.7, 'hsla(' + hue + ',80%,38%,0.98)');
    grad.addColorStop(1, 'hsla(' + hue + ',70%,22%,0.95)');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = 'hsla(' + hue + ',100%,70%,' + (0.4 * pulse) + ')';
    ctx.fillRect(x + w * 0.5 - 1, y, 2, h);

    const capY = isTop ? y + h - 4 : y;
    const capGrad = ctx.createLinearGradient(x, capY, x, capY + 4);
    capGrad.addColorStop(0, 'hsla(' + hue + ',100%,78%,' + (0.9 * pulse) + ')');
    capGrad.addColorStop(1, 'hsla(' + hue + ',100%,50%,0)');
    ctx.fillStyle = capGrad;
    ctx.fillRect(x, capY, w, 4);

    ctx.strokeStyle = 'hsla(' + hue + ',100%,72%,' + (0.5 * pulse) + ')';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

    ctx.strokeStyle = 'hsla(' + hue + ',100%,80%,0.12)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      const ly = y + (h / 4) * i;
      ctx.beginPath();
      ctx.moveTo(x + 5, ly);
      ctx.lineTo(x + w - 5, ly);
      ctx.stroke();
    }
  }

  function drawObstacle(obs) {
    const pulse = Math.sin(obs.glowPulse) * 0.35 + 0.65;
    const bottomY = obs.gapY + obs.gapHeight;
    drawPillar(obs.x, 0, obs.width, obs.gapY, obs.hue, pulse, true);
    drawPillar(obs.x, bottomY, obs.width, H - bottomY, obs.hue, pulse, false);

    const gapGrad = ctx.createLinearGradient(obs.x, obs.gapY, obs.x, bottomY);
    gapGrad.addColorStop(0, 'hsla(' + obs.hue + ',100%,70%,' + (0.06 * pulse) + ')');
    gapGrad.addColorStop(0.5, 'hsla(' + obs.hue + ',100%,80%,' + (0.14 * pulse) + ')');
    gapGrad.addColorStop(1, 'hsla(' + obs.hue + ',100%,70%,' + (0.06 * pulse) + ')');
    ctx.fillStyle = gapGrad;
    ctx.fillRect(obs.x, obs.gapY, obs.width, obs.gapHeight);
  }

  function drawBoat() {
    ctx.save();
    ctx.translate(boat.x, boat.y);
    ctx.rotate(boat.angle);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const glowGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 48);
    glowGrad.addColorStop(0, 'rgba(168,240,255,0.35)');
    glowGrad.addColorStop(1, 'rgba(168,240,255,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 48, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.moveTo(-BOAT_W * 0.55, 0);
    ctx.quadraticCurveTo(-BOAT_W * 0.55, BOAT_H * 0.55, 0, BOAT_H * 0.55);
    ctx.quadraticCurveTo(BOAT_W * 0.55, BOAT_H * 0.55, BOAT_W * 0.55, 0);
    ctx.closePath();
    const hullGrad = ctx.createLinearGradient(0, 0, 0, BOAT_H * 0.55);
    hullGrad.addColorStop(0, '#ffe6c2');
    hullGrad.addColorStop(0.5, '#c97a2b');
    hullGrad.addColorStop(1, '#6b3a12');
    ctx.fillStyle = hullGrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,180,0.6)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-BOAT_W * 0.55, 0);
    ctx.lineTo(BOAT_W * 0.55, 0);
    ctx.strokeStyle = 'rgba(255,245,220,0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, -BOAT_H * 0.05);
    ctx.lineTo(0, -BOAT_H * 1.35);
    ctx.lineTo(BOAT_W * 0.42, -BOAT_H * 0.05);
    ctx.closePath();
    const sailGrad = ctx.createLinearGradient(0, -BOAT_H * 1.35, BOAT_W * 0.42, 0);
    sailGrad.addColorStop(0, '#ffffff');
    sailGrad.addColorStop(0.5, '#d8f4ff');
    sailGrad.addColorStop(1, '#a8d8f0');
    ctx.fillStyle = sailGrad;
    ctx.shadowColor = 'rgba(168,240,255,0.7)';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.moveTo(0, -BOAT_H * 0.05);
    ctx.lineTo(0, -BOAT_H * 1.4);
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, -BOAT_H * 1.4);
    ctx.lineTo(BOAT_W * 0.28, -BOAT_H * 1.28);
    ctx.lineTo(0, -BOAT_H * 1.18);
    ctx.closePath();
    ctx.fillStyle = '#ff5757';
    ctx.fill();

    ctx.restore();
  }

  // ============================================================
  //  v1.1: Größere, hübschere Bubbles
  // ============================================================
  function drawBubbles() {
    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i];
      const px = b.x;
      const py = b.y + Math.sin(b.bob) * 5;
      const pulse = Math.sin(b.pulse) * 0.3 + 0.7;

      // Großer äußerer Glow
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const glowR = b.r * 2.8;
      const g = ctx.createRadialGradient(px, py, 2, px, py, glowR);
      g.addColorStop(0, 'rgba(255,215,0,' + (0.55 * pulse) + ')');
      g.addColorStop(0.5, 'rgba(255,180,0,' + (0.20 * pulse) + ')');
      g.addColorStop(1, 'rgba(255,215,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, glowR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Bubble-Körper
      const bg = ctx.createRadialGradient(
        px - b.r * 0.35, py - b.r * 0.4, b.r * 0.1,
        px, py, b.r
      );
      bg.addColorStop(0, 'rgba(255,255,240,1)');
      bg.addColorStop(0.35, 'rgba(255,235,120,0.95)');
      bg.addColorStop(0.75, 'rgba(255,190,40,0.9)');
      bg.addColorStop(1, 'rgba(210,140,0,0.85)');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(px, py, b.r, 0, Math.PI * 2);
      ctx.fill();

      // Innenring
      ctx.strokeStyle = 'rgba(255,255,220,' + (0.5 * pulse) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(px, py, b.r * 0.6, 0, Math.PI * 2);
      ctx.stroke();

      // Haupt-Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(px - b.r * 0.32, py - b.r * 0.35, b.r * 0.25, 0, Math.PI * 2);
      ctx.fill();

      // Sekundär-Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(px + b.r * 0.3, py + b.r * 0.15, b.r * 0.12, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters() {
    ctx.textAlign = 'center';
    ctx.font = '900 22px -apple-system, "Segoe UI", sans-serif';
    for (let i = 0; i < floaters.length; i++) {
      const f = floaters[i];
      const alpha = Math.max(0, f.life / f.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffd700';
      ctx.shadowColor = 'rgba(255,215,0,0.9)';
      ctx.shadowBlur = 12;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();
    if (screenShake > 0) {
      const sx = (Math.random() - 0.5) * screenShake;
      const sy = (Math.random() - 0.5) * screenShake;
      ctx.translate(sx, sy);
    }

    drawBackground();
    drawWater();

    for (let i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);
    drawBubbles();

    if (state !== STATE.GAMEOVER) drawBoat();

    drawParticles();
    drawFloaters();

    ctx.restore();

    if (flashAlpha > 0) {
      ctx.fillStyle = 'rgba(255,120,120,' + Math.min(1, flashAlpha) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // =========================================================
  //  GAME LOOP
  // =========================================================
  let lastTime = performance.now();

  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    if (state === STATE.PLAYING || state === STATE.MENU || state === STATE.GAMEOVER) {
      update(dt);
    } else {
      gameTime += dt * 0.001;
    }
    render();
    requestAnimationFrame(loop);
  }

  // =========================================================
  //  EVENT LISTENERS
  // =========================================================
  playBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);
  menuBtn.addEventListener('click', goToMenu);
  pauseBtn.addEventListener('click', pauseGame);
  resumeBtn.addEventListener('click', resumeGame);
  quitBtn.addEventListener('click', goToMenu);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === STATE.PLAYING) pauseGame();
  });

  resetIdleScene();
  requestAnimationFrame(loop);

  console.log('%c🌊 TIDAL v1.1 — smoother controls, realistic water, fixed bubbles', 'color:#4dc8ff; font-weight:bold; font-size:14px;');

})();
</script>
</body>
